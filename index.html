/* ========================= DIFF / HISTORY / PAGES ========================= */
function diffLines(a,b){
  const A=a.split("\n"),B=b.split("\n"); let s=0;
  while(s<A.length&&s<B.length&&A[s]===B[s]) s++;
  let ea=A.length,eb=B.length;
  while(ea>s&&eb>s&&A[ea-1]===B[eb-1]){ea--;eb--;}
  const ops=[]; for(let i=0;i<s;i++) ops.push([" ",A[i]]);
  const n=ea-s,m=eb-s;
  if(n*m<=2500000){
    const L=[]; for(let i=0;i<=n;i++) L.push(new Uint32Array(m+1));
    for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]=A[s+i]===B[s+j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
    let i=0,j=0;
    while(i<n&&j<m){
      if(A[s+i]===B[s+j]){ops.push([" ",A[s+i]]);i++;j++;}
      else if(L[i+1][j]>=L[i][j+1]){ops.push(["-",A[s+i]]);i++;}
      else{ops.push(["+",B[s+j]]);j++;}
    }
    while(i<n){ops.push(["-",A[s+i]]);i++;} while(j<m){ops.push(["+",B[s+j]]);j++;}
  } else { for(let i=0;i<n;i++) ops.push(["-",A[s+i]]); for(let j=0;j<m;j++) ops.push(["+",B[s+j]]); }
  for(let i=ea;i<A.length;i++) ops.push([" ",A[i]]);
  return ops;
}
function diffHtml(a,b){
  const ops=diffLines(a,b), keep=new Uint8Array(ops.length); let add=0,del=0;
  ops.forEach((o,i)=>{ if(o[0]!==" "){ o[0]==="+"?add++:del++; for(let k=Math.max(0,i-2);k<=Math.min(ops.length-1,i+2);k++) keep[k]=1; } });
  if(!add&&!del) return {html:"",add:0,del:0};
  let h="",gap=0;
  ops.forEach((o,i)=>{
    if(!keep[i]){ gap++; return; }
    if(gap){ h+=`<div class="g">⋯ ${gap} أسطر ⋯</div>`; gap=0; }
    h+=`<div class="${o[0]==="+"?"a":o[0]==="-"?"d":""}">${o[0]===" "?"  ":o[0]+" "}${esc(o[1])}</div>`;
  });
  if(gap) h+=`<div class="g">⋯ ${gap} أسطر ⋯</div>`;
  return {html:h,add,del};
}
function diffBlock(a,b){
  const d=diffHtml(a,b); if(!d.html) return "";
  return `<div class="note" style="margin:0 0 4px">التغييرات: <b style="color:var(--ok)">+${d.add}</b> <b style="color:var(--danger)">−${d.del}</b></div><div class="diff">${d.html}</div>`;
}

    const f=await gh(`/repos/${ctx.owner}/${ctx.name}/contents/${encPath(e.path)}?ref=${sha}`);
    const t=decodeText(await fetchBlobBytes(f.sha));
    if(t===null) throw new Error("تعذّر قراءة هذه النسخة كنص.");

async function zipDown(){
  const pre=state.cwd?state.cwd+"/":"", files=state.tree.filter(t=>t.path.startsWith(pre));
  if(!files.length) return toast("لا ملفات للتنزيل","error");
  const o=sh("تنزيل ZIP",`<p class="note">${files.length} ملف من ${esc(state.repo.name)}/${esc(state.cwd)} (كل ملف يستهلك طلباً من حد الطلبات).</p><div id="err" class="inlineerr"></div><button class="btn btn-primary btn-block" id="go" style="margin-bottom:10px">ابدأ</button>`);
  const go=o.querySelector("#go");
  go.addEventListener("click",async()=>{
    busy(go,"جارٍ التحضير...");
    try{
      if(!window.JSZip && !(await loadScriptUrl(JSZIP_URL))) throw new Error("تعذّر تحميل مكتبة ZIP (تحقق من الاتصال).");
      const z=new JSZip(); let i=0,d=0;

      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); o.remove(); toast("بدأ التنزيل","success");
    }catch(x){ const e=o.querySelector("#err"); e.style.display="block"; e.textContent=em(x); go.disabled=false; go.textContent="إعادة المحاولة"; }
  });

function zipUp(){
  const inp=document.createElement("input"); inp.type="file"; inp.accept=".zip,application/zip";
  inp.onchange=async()=>{

function mdRender(t){
  const inl=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return esc(t).split("```").map((p,i)=>i%2?`<pre>${p.replace(/^[^\n]*\n/,"")}</pre>`:p.split(/\n{2,}/).map(b=>{
    b=b.trim(); if(!b) return "";
    const h=b.match(/^(#{1,6})\s+(.*)$/); if(h) return `<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`;
    if(/^[-*]\s/.test(b)) return "<ul>"+b.split("\n").map(l=>`<li>${inl(l.replace(/^[-*]\s+/,""))}</li>`).join("")+"</ul>";
    return `<p>${inl(b).replace(/\n/g,"<br>")}</p>`;
  }).join("")).join("");
}

function relErr(e,action){
  if(!e) return "حدث خطأ غير معروف.";
  if(e.rate) return e.message;
  if(e.status===undefined) return "تعذّر الاتصال بالإنترنت أو بخوادم GitHub. تحقق من الشبكة ثم أعد المحاولة.";
  const det=e.detail?` (GitHub: ${e.detail})`:"";
  if(e.status===401) return "التوكن غير صالح أو منتهي الصلاحية. سجّل الدخول من جديد.";
  if(e.status===403) return `لا يملك التوكن صلاحية ${action||"هذه العملية"}. المطلوب: Contents: Read and write على هذا المستودع (Fine-grained)، أو صلاحية repo (Classic).${det}`;
  if(e.status===404) return `غير موجود، أو لا يملك التوكن وصولاً كافياً إلى هذا المستودع (GitHub يُرجع 404 أيضاً عند نقص الصلاحية).${det}`;
  if(e.status===422){
    const errs=e.errors||[];
    if(errs.some(x=>x.code==="already_exists"&&x.field==="tag_name")) return "يوجد إصدار بهذا الوسم مسبقاً.";
    if(errs.some(x=>x.code==="already_exists")) return "يوجد عنصر بالاسم نفسه مسبقاً.";
    const t=errs.map(x=>x.code?`${x.field||x.resource||""}: ${x.code}`:(x.message||"")).filter(Boolean).join("، ");
    return `بيانات غير صالحة${t?": "+t:""}.${det}`;
  }
  return (e.message||"فشلت العملية")+det;
}

function relTagError(t){
  if(!t) return "اكتب رقم الإصدار (Tag)، مثل v1.2.0.";

  if(/[\s\x00-\x1f\x7f~^:?*\[\\]/.test(t)) return "الوسم لا يجوز أن يحوي مسافات أو الرموز ~ ^ : ? * [ \\";

}

/* ---- رفع مرفقات الإصدار (XHR مباشر من File بدون Base64) ---- */
function relXhrUpload(url,file,type,setXhr,onPct){
  return new Promise((resolve,reject)=>{
    const x=new XMLHttpRequest(); setXhr(x);
    x.open("POST",url);
    x.setRequestHeader("Authorization",`Bearer ${state.token}`);
    x.setRequestHeader("Accept","application/vnd.github+json");
    x.setRequestHeader("Content-Type",type);
    x.upload.onprogress=ev=>{ x.sent=true; x.ld=ev.loaded; if(ev.lengthComputable) onPct(Math.min(99,Math.round(ev.loaded/ev.total*100))); };
    x.onload=()=>{
      let j=null; try{ j=JSON.parse(x.responseText); }catch{}
      if(x.status>=200&&x.status<300) resolve(j);
      else{ const e=new Error("upload"); e.status=x.status; e.detail=(j&&j.message)||""; e.errors=(j&&j.errors)||null; reject(e); }
    };
    x.onerror=()=>{ const e=new Error("network"); e.blocked=!x.sent; e.loaded=x.ld||0; reject(e); };
    x.ontimeout=()=>{ const e=new Error("network"); e.blocked=!x.sent; e.loaded=x.ld||0; reject(e); };
    x.onabort=()=>{ const e=new Error("aborted"); e.aborted=true; reject(e); };
    x.send(file);
  });
}

/* رفع ملف واحد كمرفق Release مع الوسيط وكل المحاولات الاحتياطية */
async function relUploadAsset(rel,file,name,{replace=true,onPct=()=>{},setXhr=()=>{}}={}){
  const base=relBase();
  const assets=await gh(`${base}/${rel.id}/assets?per_page=100`);
  const same=assets.find(a=>a.name.toLowerCase()===name.toLowerCase());
  if(same){
    if(same.state!=="uploaded"||replace) await gh(`${relAssetBase()}/${same.id}`,{method:"DELETE"});
    else { const e=new Error("exists"); e.status=422; e.errors=[{code:"already_exists"}]; throw e; }
  }
  const up=String(rel.upload_url||"").replace(/\{[^}]*\}$/,"");
  if(!up) throw new Error("لا يوجد upload_url لهذا الإصدار.");
  const url=up+(up.includes("?")?"&":"?")+"name="+encodeURIComponent(name);
  const pxv=(relProxyGet()||"").trim();
  const mime=assetMime(file,name);
  try{ await file.slice(0,1024).arrayBuffer(); }
  catch{ const e=new Error("file"); e.msg="تعذّر قراءة الملف من الجهاز. انسخه إلى مجلد التنزيلات (Download) ثم اخترْه من هناك"; e.stage="قراءة الملف"; throw e; }
  const finalUrl=pxv?pxv.replace(/\/+$/,"")+"/?url="+encodeURIComponent(url):url;
  try{ return await relXhrUpload(finalUrl,file,mime,setXhr,onPct); }
  catch(e){
    if(e.status!==undefined||e.aborted) throw e;
    let blob; try{ blob=new Blob([await file.arrayBuffer()],{type:mime}); }catch{ e.stage="قراءة الملف"; e.msg="تعذّر قراءة الملف"; throw e; }
    onPct(0);
    try{ return await relXhrUpload(finalUrl,blob,mime,setXhr,onPct); }
    catch(e2){
      if(e2.status!==undefined||e2.aborted) throw e2;
      try{
        const fr=await fetch(finalUrl,{method:"POST",headers:{"Authorization":`Bearer ${state.token}`,"Accept":"application/vnd.github+json","Content-Type":mime},body:blob});
        let fj=null; try{ fj=await fr.json(); }catch{}
        if(!fr.ok){ const e3=new Error("upload"); e3.status=fr.status; e3.detail=(fj&&fj.message)||""; e3.errors=(fj&&fj.errors)||null; throw e3; }
        onPct(100); return fj;
      }catch(e3){ if(e3.status!==undefined) throw e3; e3.stage="الرفع (XHR ثم fetch)"; e3.msg="XHR: "+(e2.name||"")+": "+(e2.message||""); throw e3; }
    }
  }
}

function relUpErr(e){
  if(e.status===undefined&&!e.aborted){ if(e.blocked) return "رفض المتصفح الطلب قبل إرسال أي بايت (غالباً قيد CORS على uploads.github.com أو حظر من المتصفح/WebView، وليس انقطاع إنترنت). جرّب فتح التطبيق في Chrome مباشرة، أو أرفق الملف من صفحة الإصدار على GitHub بالزر أدناه."; return "فشل الإرسال"+(e.stage?` (المرحلة: ${e.stage})`:"")+(e.loaded!==undefined?` · أُرسل ${fmtSize(e.loaded)}`:"")+(e.msg?` · ${e.msg}`:"")+` · [${e.name||""}: ${e.message||""}]`+". اضغط «رفع» لإعادة المحاولة."; }
  if(e.status===422&&(e.errors||[]).some(x=>x.code==="already_exists")) return "يوجد ملف بهذا الاسم مسبقاً في الإصدار.";
  if(e.status===413) return "الملف أكبر من الحد المسموح.";
  return relErr(e,"رفع ملفات الإصدار");
}

    if(!up) throw new Error("لا يوجد upload_url لهذا الإصدار. حدّث الإصدار وأعد المحاولة.");
    const url=up+(up.includes("?")?"&":"?")+"name="+encodeURIComponent(name);
    it.attempted=true;
    const pxv=(o.querySelector("#px").value||"").trim();
    try{ await it.file.slice(0,1024).arrayBuffer(); }
    catch{ const e=new Error("file"); e.msg="تعذّر قراءة الملف من الجهاز. انسخه إلى مجلد التنزيلات (Download) ثم اخترْه من هناك"; e.stage="قراءة الملف"; throw e; }
    if(pxv){
      try{ const pr=await fetch(pxv,{cache:"no-store"}); if(!pr.ok) throw 0; }
      catch{ const e=new Error("proxy"); e.stage="الوصول إلى الوسيط"; e.msg="لا يمكن الاتصال بالوسيط من هذا التطبيق"; throw e; }
    }
    let finalUrl=url;
    if(pxv){
      if(!/^https:\/\//i.test(pxv)) throw new Error("رابط الوسيط يجب أن يبدأ بـ https://");
      relProxySet(pxv); finalUrl=pxv.replace(/\/+$/,"")+"/?url="+encodeURIComponent(url);
    } else relProxySet("");
    let j;
    try{ j=await relXhrUpload(finalUrl,it.file,assetMime(it.file,name),x=>{ curXhr=x; },p=>{ it.pct=p; paint(i); }); }
    catch(e){
      if(e.status!==undefined||e.aborted) throw e;
      /* إعادة محاولة تلقائية: نسخة من الملف في الذاكرة (يتجاوز أخطاء ملفات أندرويد) */
      let blob; try{ blob=new Blob([await it.file.arrayBuffer()],{type:assetMime(it.file,name)}); }catch{ e.stage="قراءة الملف"; e.msg="تعذّر قراءة الملف"; throw e; }
      it.pct=0; paint(i);
      try{ j=await relXhrUpload(finalUrl,blob,assetMime(it.file,name),x=>{ curXhr=x; },p=>{ it.pct=p; paint(i); }); }
      catch(e2){
        if(e2.status!==undefined||e2.aborted){ throw e2; }
        /* محاولة أخيرة بواسطة fetch بدلاً من XHR */
        try{
          const fr=await fetch(finalUrl,{method:"POST",headers:{"Authorization":`Bearer ${state.token}`,"Accept":"application/vnd.github+json","Content-Type":assetMime(it.file,name)},body:blob});
          let fj=null; try{ fj=await fr.json(); }catch{}
          if(!fr.ok){ const e3=new Error("upload"); e3.status=fr.status; e3.detail=(fj&&fj.message)||""; e3.errors=(fj&&fj.errors)||null; throw e3; }
          j=fj; it.pct=100; paint(i);
        }catch(e3){
          if(e3.status!==undefined) throw e3;
          e3.stage=(pxv?"الرفع عبر الوسيط":"الرفع المباشر")+" (XHR ثم fetch)"; e3.msg="XHR: "+(e2.name||"")+": "+(e2.message||""); throw e3;
        }
      }
    }
    it.url=(j&&j.browser_download_url)||"";
  }
  ok.addEventListener("click",async()=>{
    if(running||relUploading) return;
    running=true; relUploading=true; cancelled=false;
    pk.disabled=true; cb.textContent="إيقاف الرفع";
    const todo=items.map((it,i)=>i).filter(i=>items[i].status!=="done");
    let done=0, failed=0, k=0;
    items.forEach((it)=>{ it.err=""; });
    draw();
    for(const i of todo){
      if(cancelled) break;
      const it=items[i]; k++;
      busy(ok,`رفع ${k}/${todo.length}...`);
      it.status="uploading"; it.pct=0; it.err=""; paint(i);
      try{ await uploadOne(it,i); it.status="done"; done++; }
      catch(e){
        it.status="ready"; failed++;
        it.err=e.aborted?"أُوقف الرفع.":relUpErr(e);
        if(!e.aborted) it.status="error";
        await relCleanupStale(rid,it.name.trim());
        if(e.aborted) cancelled=true;
      }
      paint(i);
    }
    curXhr=null; running=false; relUploading=false;
    try{ const fresh=await gh(`${relBase()}/${rid}`); relReplace(fresh); relRerender(); }catch{}
    pk.disabled=false; cb.disabled=false; cb.textContent="إغلاق"; ok.innerHTML=okHtml;
    items.forEach(it=>{ if(it.status==="error") it.status="ready"; });
    const errs=items.map(it=>it.err);
    draw(); items.forEach((it,i)=>{ it.err=errs[i]; paint(i); });
    if(done&&!failed) toast(done===1?"تم رفع الملف":`تم رفع ${done} ملفات`,"success");
    else if(done&&failed) toast(`تم رفع ${done} وفشل ${failed}. أعد المحاولة للمتبقي.`,"error");
    else if(failed) toast("فشل الرفع. راجع الرسالة تحت الملف.","error");
  });
}

const LOCK_KEY="ghfm_lock", LOCKF_KEY="ghfm_lockfail";
const hasCrypto=()=>!!(window.crypto&&crypto.subtle&&crypto.getRandomValues);
function b64u8(s){ const bin=atob(s), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
function lockCfg(){ try{ const c=JSON.parse(localStorage.getItem(LOCK_KEY)||"null"); return c&&c.pin&&c.pin.hash?c:null; }catch{ return null; } }
function lockSaveCfg(c){ try{ if(c) localStorage.setItem(LOCK_KEY,JSON.stringify(c)); else { localStorage.removeItem(LOCK_KEY); localStorage.removeItem(LOCKF_KEY); } return true; }catch{ toast("تعذّر حفظ إعدادات القفل.","error"); return false; } }
async function pbkdfBits(pass,salt,iter){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},k,256));
}
async function makePin(pin){ const salt=crypto.getRandomValues(new Uint8Array(16)), iter=150000; return {salt:bytesToB64(salt),iter,len:pin.length,hash:bytesToB64(await pbkdfBits(pin,salt,iter))}; }
async function checkPin(pin,rec){ return bytesToB64(await pbkdfBits(pin,b64u8(rec.salt),rec.iter))===rec.hash; }

/* ---- بصمة الأصبع / القفل البيومتري (WebAuthn) ---- */
async function bioAvailable(){
  try{ return !!(window.isSecureContext && window.PublicKeyCredential && PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); }
  catch{ return false; }
}
async function bioRegister(){
  const cred=await navigator.credentials.create({publicKey:{
    challenge:crypto.getRandomValues(new Uint8Array(32)), rp:{name:"Gitora"},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:"gitora",displayName:"Gitora"},
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},
    timeout:60000, attestation:"none"}});
  return bytesToB64(new Uint8Array(cred.rawId));
}
async function bioVerify(id){
  const r=await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:"public-key",id:b64u8(id)}],userVerification:"required",timeout:60000}});
  return !!r;
}

/* ---- شاشة القفل ---- */
let lockEl=null, lockHiddenAt=0, lockBusy=false;
function lockFailGet(){ try{ return JSON.parse(localStorage.getItem(LOCKF_KEY)||"{}")||{}; }catch{ return {}; } }
function lockFailSet(o){ try{ localStorage.setItem(LOCKF_KEY,JSON.stringify(o)); }catch{} }
function showLock(){
  const c=lockCfg(); if(!c||lockEl) return;
  if(!hasCrypto()){ toast("القفل متوقف مؤقتاً: هذا المتصفح لا يدعم التشفير في هذا السياق.","error"); return; }
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
  const len=c.pin.len||4; let buf="", cd=null;
  const ov=el(`<div class="lockov"><div class="lk">
    <img src="${LOGO}" alt="" /><h2>Gitora</h2>
    <div class="lk-msg" id="lkm">أدخل رمز القفل</div>
    <div class="lk-dots" id="lkd">${Array.from({length:len},()=>"<i></i>").join("")}</div>
    <div class="lk-pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
      <button class="ghost" id="lkb" ${c.bio?"":'style="visibility:hidden" disabled'}>${icon("fingerprint",26)}</button>
      <button data-n="0">0</button>
      <button class="ghost" id="lkx">${icon("backspace",24)}</button></div>
  </div></div>`);
  const msg=m=>{ ov.querySelector("#lkm").textContent=m; };
  const dots=()=>ov.querySelectorAll("#lkd i").forEach((d,i)=>d.classList.toggle("on",i<buf.length));
  const cooldown=()=>{
    const f=lockFailGet(), left=Math.ceil(((f.until||0)-Date.now())/1000);
    clearTimeout(cd);
    if(left>0){ msg(`محاولات كثيرة. انتظر ${left} ث`); cd=setTimeout(cooldown,500); return true; }
    if(f.until){ lockFailSet({fails:f.fails||0}); msg("أدخل رمز القفل"); }
    return false;
  };
  const unlock=()=>{ clearTimeout(cd); document.removeEventListener("keydown",onKey,true); ov.remove(); lockEl=null; lockBusy=false; };
  async function submit(){
    lockBusy=true;
    let ok=false; try{ ok=await checkPin(buf,c.pin); }catch{}
    lockBusy=false;
    if(ok){ lockFailSet({}); unlock(); return; }
    const f=lockFailGet(), fails=(f.fails||0)+1; let until=0;
    if(fails%5===0) until=Date.now()+30000*Math.pow(2,Math.min(4,fails/5-1));
    lockFailSet({fails,until});
    const d=ov.querySelector("#lkd"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
    buf=""; dots(); msg("الرمز غير صحيح"); if(until) cooldown();
  }
  function push(n){ if(lockBusy||cooldown()) return; if(buf.length>=len) return; buf+=n; dots(); if(buf.length===len) submit(); }
  function pop(){ if(lockBusy) return; buf=buf.slice(0,-1); dots(); }
  async function tryBio(){
    if(!c.bio||lockBusy||cooldown()) return;
    try{ if(await bioVerify(c.bio.id)){ lockFailSet({}); unlock(); } }catch{}
  }
  function onKey(ev){
    if(/^\d$/.test(ev.key)){ ev.preventDefault(); push(ev.key); }
    else if(ev.key==="Backspace"){ ev.preventDefault(); pop(); }
  }
  ov.querySelectorAll("[data-n]").forEach(b=>b.addEventListener("click",()=>push(b.dataset.n)));
  ov.querySelector("#lkx").addEventListener("click",pop);
  ov.querySelector("#lkb").addEventListener("click",tryBio);
  document.addEventListener("keydown",onKey,true);
  document.body.appendChild(ov); lockEl=ov;
  cooldown();
  if(c.bio) setTimeout(tryBio,350);
}
document.addEventListener("visibilitychange",()=>{
  const c=lockCfg(); if(!c) return;
  if(document.hidden){ lockHiddenAt=Date.now(); return; }
  const wait=(c.auto==null?60:c.auto)*1000;
  if(!lockEl && lockHiddenAt && Date.now()-lockHiddenAt>=wait) showLock();
});

/* ---- نسخة احتياطية مشفّرة للحسابات ---- */
async function aesKey(pass,salt,iter){
  const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt,iterations:iter},k,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptBackup(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)), iv=crypto.getRandomValues(new Uint8Array(12)), iter=250000;
  const key=await aesKey(pass,salt,iter);
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))));
  return JSON.stringify({app:"gitora",v:1,iter,salt:bytesToB64(salt),iv:bytesToB64(iv),data:bytesToB64(ct)});
}
async function decryptBackup(text,pass){
  let j; try{ j=JSON.parse(String(text).trim()); }catch{ throw new Error("المحتوى ليس نسخة احتياطية صالحة."); }
  if(!j||j.app!=="gitora"||j.v!==1||!j.data||!j.salt||!j.iv||!(j.iter>=1000&&j.iter<=1000000)) throw new Error("المحتوى ليس نسخة احتياطية صالحة من Gitora.");
  try{
    const key=await aesKey(pass,b64u8(j.salt),j.iter);
    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64u8(j.iv)},key,b64u8(j.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }catch{ throw new Error("كلمة السر خاطئة أو الملف تالف."); }
}
function mergeAccounts(arr){
  const list=accList(); let add=0, upd=0;
  for(const x of (Array.isArray(arr)?arr:[])){
    if(!x||typeof x.token!=="string"||!x.token||typeof x.login!=="string"||!x.login) continue;
    const ex=list.find(a=>a.token===x.token)||list.find(a=>(a.login||"").toLowerCase()===x.login.toLowerCase());
    if(ex){ ex.token=x.token; ex.login=x.login.slice(0,80); upd++; }
    else{ list.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:String(x.name||x.login).slice(0,30),login:x.login.slice(0,80),token:x.token,added:Date.now()}); add++; }
  }
  accSave(list); return {add,upd};
}

function showExport(){
  if(!hasCrypto()) return toast("التشفير غير مدعوم في هذا السياق (يلزم صفحة https أو متصفح حديث).","error");
  const accs=accList();
  if(!accs.length) return toast("لا توجد حسابات محفوظة لتصديرها.","error");
  const o=openSheet(`<h3>تصدير الحسابات</h3>
    <p class="note">${accs.length} حساب سيُشفَّر بكلمة سر. <b>لا يمكن استعادة النسخة إن نسيت كلمة السر.</b></p>
    <div class="field"><label>كلمة السر (6 أحرف على الأقل)</label><input id="p1" type="password" dir="ltr" style="text-align:left" autocomplete="off" /></div>
    <div class="field"><label>أعد كتابة كلمة السر</label><input id="p2" type="password" dir="ltr" style="text-align:left" autocomplete="off" /></div>
    <div id="err" class="inlineerr"></div>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("save",16)} إنشاء النسخة</button></div>`);
  wireSheet(o);
  const p1=o.querySelector("#p1"), p2=o.querySelector("#p2"), err=o.querySelector("#err"), ok=o.querySelector("#ok");
  const fail=m=>{ err.style.display="block"; err.textContent=m; };
  setTimeout(()=>p1.focus(),60);
  ok.addEventListener("click",async()=>{
    if(p1.value.length<6) return fail("كلمة السر قصيرة (6 أحرف على الأقل).");
    if(p1.value!==p2.value) return fail("كلمتا السر غير متطابقتين.");
    busy(ok,"جارٍ التشفير...");
    try{
      const text=await encryptBackup({accounts:accs,exported:new Date().toISOString()},p1.value);
      o.remove();
      const d=new Date(), fn=`gitora-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.gitora`;
      const r=sh("تم إنشاء النسخة ✓",`<p class="note">احتفظ بالملف في مكان آمن. إن لم يبدأ التنزيل على جهازك فانسخ النص والصقه في ملاحظة أو رسالة لنفسك.</p>
        <div class="tgrid"><button class="btn btn-primary" data-t="dl"><b>⬇️</b>تنزيل الملف</button><button class="btn btn-ghost" data-t="cp"><b>📋</b>نسخ النص</button></div>`);
      r.addEventListener("click",async ev=>{
        const b=ev.target.closest("[data-t]"); if(!b) return;
        if(b.dataset.t==="dl"){ triggerDownload(new Blob([text],{type:"application/octet-stream"}),fn); toast("بدأ التنزيل: "+fn,"success"); }
        else{ const okc=await copyText(text); toast(okc?"تم نسخ النسخة المشفّرة":"تعذّر النسخ",okc?"success":"error"); }
      });
    }catch(e){ fail("تعذّر إنشاء النسخة."); ok.disabled=false; ok.innerHTML=`${icon("save",16)} إنشاء النسخة`; }
  });
}
function showImport(){
  if(!hasCrypto()) return toast("التشفير غير مدعوم في هذا السياق (يلزم صفحة https أو متصفح حديث).","error");
  let fileText="";
  const o=openSheet(`<h3>استيراد الحسابات</h3>
    <p class="note">اختر ملف النسخة الاحتياطية أو الصق نصها. تُدمج الحسابات مع الموجودة ولا يُحذف شيء.</p>
    <button class="btn btn-ghost btn-block btn-sm" id="pk">${icon("upload",15)} اختيار ملف النسخة</button>
    <div id="fn" class="note" style="margin:6px 0 0;direction:ltr;text-align:left"></div>
    <div class="field" style="margin-top:12px"><label>أو الصق النص هنا</label><textarea id="tx" class="relta" dir="ltr" style="min-height:80px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:11px" spellcheck="false"></textarea></div>
    <div class="field"><label>كلمة السر</label><input id="pw" type="password" dir="ltr" style="text-align:left" autocomplete="off" /></div>
    <div id="err" class="inlineerr"></div>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("check",16)} استيراد</button></div>`);
  wireSheet(o);
  const picker=document.createElement("input"); picker.type="file";
  const err=o.querySelector("#err"), ok=o.querySelector("#ok");
  const fail=m=>{ err.style.display="block"; err.textContent=m; };
  o.querySelector("#pk").addEventListener("click",()=>{ picker.value=""; picker.click(); });
  picker.addEventListener("change",async()=>{
    const f=picker.files[0]; if(!f) return;
    if(f.size>2*1024*1024) return fail("الملف كبير جداً لنسخة احتياطية.");
    try{ fileText=await f.text(); o.querySelector("#fn").textContent=f.name; err.style.display="none"; }catch{ fail("تعذّر قراءة الملف."); }
  });
  ok.addEventListener("click",async()=>{
    const text=(o.querySelector("#tx").value.trim()||fileText), pw=o.querySelector("#pw").value;
    if(!text) return fail("اختر ملفاً أو الصق النص.");
    if(!pw) return fail("أدخل كلمة السر.");
    busy(ok,"جارٍ فك التشفير...");
    try{
      const data=await decryptBackup(text,pw), r=mergeAccounts(data&&data.accounts);
      o.remove();
      if(!r.add&&!r.upd) return toast("لا توجد حسابات صالحة في النسخة.","error");
      toast(`تمت الاستعادة: أُضيف ${r.add}${r.upd?` · حُدّث ${r.upd}`:""}`,"success");
      if(state.view==="login") render();
    }catch(e){ fail(e.message||"فشل الاستيراد."); ok.disabled=false; ok.innerHTML=`${icon("check",16)} استيراد`; }
  });
}

const ACT_COL={ok:"#34d399",bad:"#ff5d73",run:"#22d3ee",wait:"#f5b544",off:"#8f9cc4"};
function actBase(){ return `/repos/${state.repo.owner}/${state.repo.name}/actions`; }
function actInit(){
  const k=state.repo?state.repo.fullName:"";
  if(!state.act||state.act.key!==k){
    if(state.act) clearTimeout(state.act.timer);
    state.act={key:k,runs:[],wfs:[],wf:"",loading:false,loaded:false,error:"",page:1,more:false,loadingMore:false,openId:null,detail:null,detailLoading:false,derr:"",timer:null};
  }
  return state.act;
}
function actStat(r){
  const s=r.status, c=r.conclusion;
  if(s==="completed"){
    if(c==="success") return {k:"ok",l:"نجح",i:"check"};
    if(c==="failure") return {k:"bad",l:"فشل",i:"close"};
    if(c==="timed_out") return {k:"bad",l:"انتهت المهلة",i:"close"};
    if(c==="startup_failure") return {k:"bad",l:"فشل البدء",i:"close"};
    if(c==="cancelled") return {k:"off",l:"أُلغي",i:"close"};
    if(c==="skipped") return {k:"off",l:"تم التخطي",i:"info"};
    if(c==="action_required") return {k:"wait",l:"يتطلب موافقة",i:"warn"};
    return {k:"off",l:c||"منتهٍ",i:"info"};
  }
  if(s==="in_progress") return {k:"run",l:"قيد التشغيل",i:"refresh",spin:true};
  return {k:"wait",l:s==="waiting"?"بانتظار الموافقة":"في الانتظار",i:"clock"};
}
function fmtDur(ms){ if(!(ms>=0)) return "—"; const s=Math.round(ms/1000); if(s<60) return s+" ث"; const m=Math.floor(s/60); if(m<60) return `${m} د ${s%60} ث`; return `${Math.floor(m/60)} س ${m%60} د`; }
function runDur(r){ const a=r.run_started_at||r.created_at; const b=r.status==="completed"?r.updated_at:new Date().toISOString(); return fmtDur(new Date(b)-new Date(a)); }
function jobDur(j){ return j.started_at?fmtDur(new Date(j.completed_at||Date.now())-new Date(j.started_at)):"—"; }
function actTitle(r){ return r.display_title||((r.head_commit&&r.head_commit.message)||"").split("\n")[0]||r.name||("#"+r.run_number); }
function actErr(e,action){
  if(!e) return "حدث خطأ غير معروف.";
  if(e.rate) return e.message;
  if(e.status===undefined) return "تعذّر الاتصال بالإنترنت أو بخوادم GitHub. تحقق من الشبكة ثم أعد المحاولة.";
  const det=e.detail?` (GitHub: ${e.detail})`:"";
  if(e.status===401) return "التوكن غير صالح أو منتهي الصلاحية.";
  if(e.status===403) return `لا يملك التوكن صلاحية ${action}. المطلوب: Actions: Read and write (Fine-grained)، أو repo و workflow (Classic).${det}`;
  if(e.status===404) return `غير موجود، أو لا يملك التوكن وصولاً كافياً. تأكد من صلاحية Actions على هذا المستودع.${det}`;
  if(e.status===409) return `لا يمكن تنفيذ ذلك في الحالة الحالية للتشغيل.${det}`;
  if(e.status===422) return /workflow_dispatch/i.test(e.detail||"")?"هذا الـ workflow لا يحوي المشغّل on: workflow_dispatch في ملفه. أضفه أولاً ثم أعد المحاولة.":`بيانات غير صالحة.${det}`;
  return (e.message||"فشلت العملية")+det;
}
/* طلبات تعيد 201/202 بجسم فارغ أو {} */
async function ghAction(path,method,body){
  try{ return await gh(path,{method,body:body?JSON.stringify(body):undefined}); }
  catch(e){ if(e instanceof SyntaxError) return null; throw e; }
}
/* جلب ما يُعيد GitHub توجيهه (السجلات والملفات الناتجة): مباشرة ثم عبر الوسيط */
async function actFetchRaw(url){
  const hd=headers({"Accept":"application/vnd.github+json"});
  let first;
  try{ const r=await fetch(url,{cache:"no-store",headers:hd}); if(r.ok) return r; first=r; }catch(e){ first=e; }
  if(typeof Response!=="undefined" && first instanceof Response){
    if(first.status===401) logout(true);
    const e=new Error(mapStatus(first.status)); e.status=first.status;
    try{ e.detail=(await first.json()).message||""; }catch{}
    throw e;
  }
  const px=(relProxyGet()||"").trim();
  if(px){
    try{ const r=await fetch(px.replace(/\/+$/,"")+"/?url="+encodeURIComponent(url),{cache:"no-store",headers:hd}); if(r.ok) return r; }catch{}
  }
  const e=new Error("تعذّر الجلب من المتصفح."); e.cors=true; throw e;
}

function actRerender(){
  if(state.view!=="actions") return;
  const m=shell.querySelector("main"), st=m?m.scrollTop:0;
  render();
  const m2=shell.querySelector("main"); if(m2) m2.scrollTop=st;
}
function actSchedule(){
  const A=state.act; if(!A) return;
  clearTimeout(A.timer); A.timer=null;
  if(state.view!=="actions") return;
  const live=A.openId?(A.detail&&A.detail.run&&A.detail.run.status!=="completed"):A.runs.some(r=>r.status!=="completed");
  if(!live) return;
  A.timer=setTimeout(async()=>{
    if(state.act!==A||state.view!=="actions") return;
    if(document.hidden){ actSchedule(); return; }
    if(A.openId) await actLoadDetail(A.openId,true); else await actLoad(false,true);
  },6000);
}
async function actLoad(more,quiet){
  const A=actInit(), key=A.key;
  if(more){ if(A.loadingMore||!A.more) return; A.loadingMore=true; }
  else if(quiet){ if(A.loading) return; }
  else { if(A.loading) return; A.loading=true; A.error=""; }
  if(!quiet) actRerender();
  try{
    const page=more?A.page+1:1;
    const path=A.wf?`${actBase()}/workflows/${A.wf}/runs`:`${actBase()}/runs`;
    const reqs=[gh(`${path}?per_page=30&page=${page}`)];
    if(!more&&!A.wfs.length) reqs.push(gh(`${actBase()}/workflows?per_page=100`).catch(()=>null));
    const [r,w]=await Promise.all(reqs);
    if(state.act!==A||A.key!==key) return;
    const list=r.workflow_runs||[];
    if(more) A.runs=A.runs.concat(list.filter(x=>!A.runs.some(y=>y.id===x.id)));
    else if(quiet) A.runs=list.concat(A.runs.filter(x=>!list.some(y=>y.id===x.id)));
    else A.runs=list;
    if(!quiet||!A.loaded){ A.page=page; A.more=list.length===30; }
    if(w&&w.workflows) A.wfs=w.workflows;
    A.loaded=true;
  }catch(e){ if(state.act===A&&!quiet) A.error=actErr(e,"قراءة العمليات"); }
  finally{ if(state.act===A){ A.loading=false; A.loadingMore=false; actRerender(); actSchedule(); } }
}
async function actLoadDetail(id,quiet){
  const A=actInit();
  if(!quiet){ A.detailLoading=true; A.detail=null; A.derr=""; actRerender(); }
  try{
    const b=actBase();
    const [run,jobs,arts]=await Promise.all([gh(`${b}/runs/${id}`),gh(`${b}/runs/${id}/jobs?per_page=100`),gh(`${b}/runs/${id}/artifacts?per_page=100`).catch(()=>({artifacts:[]}))]);
    if(state.act!==A||A.openId!==id) return;
    A.detail={run,jobs:jobs.jobs||[],arts:(arts&&arts.artifacts)||[]}; A.derr="";
    const i=A.runs.findIndex(x=>x.id===id); if(i>-1) A.runs[i]=run;
  }catch(e){
    if(state.act===A&&A.openId===id){
      if(e.status===404){ A.runs=A.runs.filter(x=>x.id!==id); A.openId=null; A.detail=null; toast("هذا التشغيل لم يعد موجوداً.","info"); }
      else if(!quiet) A.derr=actErr(e,"قراءة التشغيل");
    }
  }
  finally{ if(state.act===A){ A.detailLoading=false; actRerender(); actSchedule(); } }
}
function openActions(){
  const A=actInit(); state.view="actions"; A.openId=null;
  if(A.loaded){ render(); actLoad(false,true); } else actLoad();
}

function renderActions(){ const A=actInit(); return A.openId?renderActDetail(A):renderActList(A); }
function renderActList(A){
  const rl=state.rateLimit?` · ${state.rateLimit.remaining}/${state.rateLimit.limit}`:"";
  const wrap=el(`<div class="screen">
    ${appBar({title:"Actions",sub:state.repo.name+rl,showBack:true,actions:[`<button class="iconbtn" data-action="refresh" title="تحديث">${icon("refresh",18)}</button>`]})}
    <div class="toolbar">
      <div class="pill-select" style="min-width:0"><select id="wfSel"><option value="">كل الـ workflows</option>${A.wfs.map(w=>`<option value="${w.id}" ${String(w.id)===String(A.wf)?"selected":""}>${esc(w.name)}</option>`).join("")}</select></div>
      <div class="spacer"></div>
      <button class="btn btn-primary btn-sm" id="runBtn">${icon("play",14)} تشغيل</button>
    </div>
    <main id="actBody"></main></div>`);
  wrap.querySelector('[data-action="back"]').addEventListener("click",()=>{ clearTimeout(A.timer); state.view="browser"; render(); });
  wrap.querySelector('[data-action="refresh"]').addEventListener("click",()=>actLoad());
  wrap.querySelector("#wfSel").addEventListener("change",e=>{ A.wf=e.target.value; A.runs=[]; A.loaded=false; A.more=false; actLoad(); });
  wrap.querySelector("#runBtn").addEventListener("click",showDispatch);
  const box=wrap.querySelector("#actBody");
  if(A.loading&&!A.runs.length){ box.innerHTML=skeletons(4,true); return wrap; }
  if(A.error&&!A.runs.length){
    box.innerHTML=`<div class="empty">${icon("warn",46)}<p>${esc(A.error)}</p><button class="btn btn-primary btn-sm" id="retry" style="margin-top:14px">${icon("refresh",15)} إعادة المحاولة</button></div>`;
    box.querySelector("#retry").addEventListener("click",()=>actLoad());
    return wrap;
  }
  if(!A.runs.length){
    box.innerHTML=`<div class="empty">${icon("zap",46)}<p>لا توجد عمليات تشغيل ${A.wf?"لهذا الـ workflow":"في هذا المستودع"} بعد.<br/>أضف ملف workflow في <span dir="ltr">.github/workflows</span> أو اضغط «تشغيل».</p></div>`;
    return wrap;
  }
  const list=el(`<div class="list"></div>`);
  if(A.error) list.insertAdjacentHTML("afterbegin",`<div class="inlineerr" style="display:block;margin-bottom:10px">${esc(A.error)}</div>`);
  A.runs.forEach((r,i)=>{
    const s=actStat(r);
    const c=el(`<button class="runcard" style="--kc:${ACT_COL[s.k]};animation-delay:${Math.min(i,8)*30}ms">
      <div class="rc-top"><span class="rc-ic">${icon(s.i,17,s.spin?"spin":"")}</span><span class="rc-title">${esc(actTitle(r))}</span><span class="rbadge ${s.k}">${s.l}</span></div>
      <div class="rc-sub">${esc(r.name||"")} · #${r.run_number}${r.run_attempt>1?` (محاولة ${r.run_attempt})`:""}</div>
      <div class="chips" style="margin-top:10px"><span class="chip tag">${icon("repo",12)}${esc(r.head_branch||"—")}</span><span class="chip dim" dir="ltr">${esc(r.event||"")}</span>${r.actor?`<span class="chip dim" dir="ltr">@${esc(r.actor.login)}</span>`:""}</div>
      <div class="rmeta" style="margin-top:10px"><span>${icon("clock",11)} ${timeAgo(r.created_at)}</span><span>${runDur(r)}</span></div>
    </button>`);
    c.addEventListener("click",()=>{ A.openId=r.id; A.detail=null; render(); actLoadDetail(r.id); });
    list.appendChild(c);
  });
  if(A.more){
    const m=el(`<button class="btn btn-ghost btn-block btn-sm">${A.loadingMore?'<span class="spinner"></span> جارٍ التحميل...':"تحميل المزيد"}</button>`);
    m.disabled=A.loadingMore; m.addEventListener("click",()=>actLoad(true)); list.appendChild(m);
  }
  box.appendChild(list);
  return wrap;
}

function renderActDetail(A){
  const d=A.detail, r=d&&d.run;
  const wrap=el(`<div class="screen">
    ${appBar({title:r?actTitle(r):"التشغيل",sub:r?`#${r.run_number} · ${r.name||""}`:"",showBack:true,actions:[
      `<button class="iconbtn" data-action="refresh" title="تحديث">${icon("refresh",18)}</button>`,
      r?`<a class="iconbtn" href="${esc(r.html_url)}" target="_blank" rel="noopener" title="فتح على GitHub">${icon("external",18)}</a>`:""]})}
    <main id="adBody"></main></div>`);
  wrap.querySelector('[data-action="back"]').addEventListener("click",()=>{ clearTimeout(A.timer); A.openId=null; A.detail=null; render(); actLoad(false,true); });
  wrap.querySelector('[data-action="refresh"]').addEventListener("click",()=>actLoadDetail(A.openId));
  const box=wrap.querySelector("#adBody");
  if(!r){
    if(A.derr){
      box.innerHTML=`<div class="empty">${icon("warn",46)}<p>${esc(A.derr)}</p><button class="btn btn-primary btn-sm" id="retry" style="margin-top:14px">${icon("refresh",15)} إعادة المحاولة</button></div>`;
      box.querySelector("#retry").addEventListener("click",()=>actLoadDetail(A.openId));
    } else box.innerHTML=skeletons(3,true);

async function actDo(run,kind,btn){
  if(kind==="del"){
    const go=await confirmSheet("حذف التشغيل","سيُحذف هذا التشغيل وسجلاته وملفاته الناتجة نهائياً.","حذف","danger");
    if(!go) return;
  }
  const map={rerun:["rerun","POST","تمت إعادة التشغيل"],rerunf:["rerun-failed-jobs","POST","تمت إعادة تشغيل المهام الفاشلة"],cancel:["cancel","POST","تم إرسال طلب الإلغاء"],del:["","DELETE","تم حذف التشغيل"]};
  const m=map[kind]; if(!m) return;
  const k="act"+kind+run.id; if(relBusyK.has(k)) return; relBusyK.add(k);
  const old=btn.innerHTML; busy(btn,"جارٍ التنفيذ...");
  try{
    await ghAction(`${actBase()}/runs/${run.id}${m[0]?"/"+m[0]:""}`,m[1]);
    toast(m[2],"success");
    const A=state.act;
    if(kind==="del"&&A){ A.runs=A.runs.filter(x=>x.id!==run.id); A.openId=null; A.detail=null; if(state.view==="actions") render(); }
    else setTimeout(()=>{ const B=state.act; if(B&&B.openId===run.id&&state.view==="actions") actLoadDetail(run.id,true); },1500);
  }catch(e){ toast(actErr(e,"التحكم بالعمليات"),"error"); }
  finally{ relBusyK.delete(k); if(btn.isConnected){ btn.disabled=false; btn.innerHTML=old; } }
}
function actCorsFallback(run,what){
  sh("تعذّر "+what+" من داخل التطبيق",`<p class="note">GitHub يمنع المتصفح أحياناً من جلب هذا النوع من الملفات مباشرة (قيد CORS). افتح صفحة التشغيل على GitHub، وستجد السجلات والملفات الناتجة هناك.</p>

async function actDownloadArt(a,run,btn){
  const old=btn.innerHTML; busy(btn,"جارٍ التنزيل...");

    const res=await actFetchRaw(`${API}${actBase()}/artifacts/${a.id}/zip`);

/* ---- معاينة Markdown (مصغّرة تكفي ما يولّده الاستوديو) ---- */
function rdMd2Html(src){
  const BLOCK=/^<\/?(div|p|table|thead|tbody|tr|td|th|h[1-6]|img|details|summary|br|hr|center|ul|ol|li|pre|blockquote|picture|source)\b/i;
  const inl=s=>{
    const codes=[]; s=s.replace(/`([^`]+)`/g,(_,c)=>{ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
    s=s.replace(/<(?!\/?[a-zA-Z][^>]*>)/g,"&lt;");
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+"[^"]*")?\)/g,'<img alt="$1" src="$2">');
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
    s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>").replace(/~~([^~]+)~~/g,"<del>$1</del>");
    return s.replace(/\u0000(\d+)\u0000/g,(_,i)=>`<code>${esc(codes[+i])}</code>`);
  };
  const L=String(src).replace(/\r/g,"").split("\n"), out=[]; let i=0;
  const startsBlock=l=>/^(```|#{1,6}\s|>\s?|(-{3,}|\*{3,})\s*$|\s*([-*+]|\d+[.)])\s+)/.test(l)||BLOCK.test(l.trim());
  while(i<L.length){
    const l=L[i]; if(!l.trim()){ i++; continue; }
    let m;
    if((m=l.match(/^```/))){ const c=[]; i++; while(i<L.length&&!/^```/.test(L[i])) c.push(L[i++]); i++; out.push(`<pre><code>${esc(c.join("\n"))}</code></pre>`); continue; }
    if((m=l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){ out.push(`<h${m[1].length}>${inl(m[2])}</h${m[1].length}>`); i++; continue; }
    if(/^(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){ out.push("<hr>"); i++; continue; }
    if(/^>\s?/.test(l)){ const q=[]; while(i<L.length&&/^>\s?/.test(L[i])) q.push(L[i++].replace(/^>\s?/,"")); out.push(`<blockquote>${rdMd2Html(q.join("\n"))}</blockquote>`); continue; }
    if((m=l.match(/^\s*([-*+]|(\d+)[.)])\s+(.*)$/))){
      const ord=!!m[2], start=ord?+m[2]:1, it=[];
      while(i<L.length&&(m=L[i].match(/^\s*([-*+]|(\d+)[.)])\s+(.*)$/))&&!!m[2]===ord){ it.push(m[3]); i++; }
      out.push(`<${ord?"ol":"ul"}${ord&&start!==1?` start="${start}"`:""}>${it.map(x=>`<li>${inl(x)}</li>`).join("")}</${ord?"ol":"ul"}>`); continue;
    }
    if(/^\|.*\|\s*$/.test(l)&&/^\|?\s*:?-{2,}/.test(L[i+1]||"")){
      const row=r=>r.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
      const h=row(l); i+=2; const rows=[]; while(i<L.length&&/^\|.*\|\s*$/.test(L[i])) rows.push(row(L[i++]));
      out.push(`<table><thead><tr>${h.map(c=>`<th>${inl(c)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`); continue;
    }
    if(BLOCK.test(l.trim())){ const r=[]; while(i<L.length&&L[i].trim()) r.push(L[i++]); out.push(r.join("\n")); continue; }
    const p=[]; while(i<L.length&&L[i].trim()&&(p.length===0||!startsBlock(L[i]))) p.push(L[i++].trim());

}

      <div class="rd-actions"><button class="btn btn-ghost btn-sm" id="rdAuto">${icon("refresh",15)} تعبئة تلقائية من المستودع</button><button class="btn btn-ghost btn-sm" id="rdSample">📋 مثال جاهز</button></div></div>
    <div class="rd-card"><h4>📖 التعريف</h4>
      ${rdF("name","اسم التطبيق","مثال: Gitora")}
      ${rdF("tag","العبارة التعريفية (سطر واحد)","تظهر تحت الاسم مباشرة. إن تركتها فارغة تُؤخذ من أول جملة في الوصف")}
      ${rdF("desc","الوصف","اكتب وصف المشروع بأسلوبك. افصل الفقرات بسطر فارغ.",{area:true,rows:6,hint:"التطبيق ينظّف النص ويوزّعه ويضيف الترويسة والأقسام والشارات تلقائيًا."})}</div>
    <div class="rd-card"><h4>✨ المميزات</h4>
      ${rdF("feats","سطر لكل ميزة","أوفلاين: يعمل بدون إنترنت\nسريع: يفتح فورًا",{area:true,rows:5,hint:"الصيغة <code>العنوان: الشرح</code>. تُضاف الإيموجي المناسبة تلقائيًا."})}
      <div class="field"><label>شكل العرض</label>${rdSeg("data-sk","featStyle",[["list","قائمة"],["cards","بطاقات (عمودان)"]])}</div></div>
    <div class="rd-card"><h4>🚀 التثبيت والاستخدام</h4>
      ${rdF("steps","سطر لكل خطوة","حمّل ملف APK\nافتحه واضغط تثبيت\ngit clone https://github.com/USER/REPO.git",{area:true,rows:5,hint:"الأسطر التي تبدأ بأوامر مثل <code>git</code> و <code>npm</code> و <code>cd</code> تتحوّل تلقائيًا إلى صندوق أكواد."})}</div>
    <div class="rd-card"><h4>🛠️ التقنيات والروابط</h4>
      ${rdF("tech","التقنيات (افصل بفاصلة)","HTML, CSS, JavaScript, Firebase",{ltr:true,hint:"تتحوّل إلى شارات ملوّنة بشعاراتها."})}
      ${rdF("dl","رابط التحميل","https://github.com/USER/REPO/releases/latest",{ltr:true})}
      ${rdF("demo","رابط التجربة المباشرة","https://USER.github.io/REPO",{ltr:true})}
      ${rdF("links","روابط أخرى (سطر لكل رابط)","تيليجرام | https://t.me/channel\nتيك توك | https://tiktok.com/@name",{area:true,rows:3,ltr:true,hint:"الصيغة <code>الاسم | الرابط</code>."})}</div>
    <div class="rd-card"><h4>📄 الترخيص والمطوّر</h4>
      <div class="field"><label>الترخيص</label><select data-k="license"><option value="">بدون قسم ترخيص</option><option value="MIT">MIT (مفتوح)</option><option value="Apache-2.0">Apache 2.0</option><option value="GPL-3.0">GPL 3.0</option><option value="ALL">جميع الحقوق محفوظة</option></select></div>
      ${rdF("author","اسم المطوّر / حساب GitHub","username",{ltr:true})}
      <label class="rd-chk"><input type="checkbox" data-k="repoBadges" /><span>إضافة شارات المستودع (الإصدار، النجوم، آخر تحديث)</span></label></div>`;
}
function rdTab1(){
  const b=RD.b;
  const modes=rdSeg("data-sb","mode",[["gen","توليد بانر"],["up","رفع صورة"],["none","بدون"]]);
  let ban="";
  if(b.mode==="gen"){
    ban=`<canvas id="rdCv" width="1280" height="640"></canvas>
      <div class="field" style="margin-top:12px"><label>الألوان</label><div class="rd-sw" data-sb="theme">${RD_THEMES.map((t,i)=>`<button type="button" data-v="${i}" title="${t.n}" style="background:linear-gradient(135deg,${t.c.join(",")})"></button>`).join("")}</div></div>
      <div class="field"><label>النقش</label>${rdSeg("data-sb","pattern",[["grid","شبكة"],["dots","نقاط"],["waves","أمواج"],["none","بدون"]])}</div>
      ${rdF2("title","عنوان البانر","يؤخذ من اسم التطبيق إن تُرك فارغًا")}
      ${rdF2("sub","النص الفرعي","يؤخذ من العبارة التعريفية إن تُرك فارغًا")}
      <div class="field"><label>شعار التطبيق (اختياري)</label><div class="rd-actions" style="margin:0"><label class="btn btn-ghost btn-sm" style="cursor:pointer">${icon("image",15)} ${RD.logo?"تغيير الشعار":"اختيار شعار"}<input type="file" accept="image/*" id="rdLogo" hidden /></label>${RD.logo?`<button class="btn btn-danger-soft btn-sm" id="rdLogoX">إزالة</button>`:""}</div></div>
      <label class="rd-chk"><input type="checkbox" data-b="showTech" /><span>إظهار التقنيات أسفل العنوان</span></label>
      <label class="rd-chk"><input type="checkbox" data-b="showRepo" /><span>إظهار رابط المستودع أسفل البانر</span></label>
      <div class="rd-actions"><button class="btn btn-ghost btn-sm" id="rdBanDl">${icon("download",15)} حفظ البانر على جهازي</button></div>`;
  }else if(b.mode==="up"){
    ban=`${RD.up?`<img src="${RD.up.thumb}" style="width:100%;border-radius:12px;border:1px solid var(--line2);display:block;margin-bottom:10px" />`:""}
      <label class="rd-drop">${icon("image",18)} ${RD.up?"تغيير الصورة":"اختر صورة البانر (PNG / JPG / WebP / SVG)"}<input type="file" accept="image/*" id="rdUp" hidden /></label>
      <div class="hint">المقاس المثالي 1280×640 (نسبة 2:1) وهو نفس مقاس صورة المعاينة الاجتماعية في GitHub.</div>`;
  }else ban=`<p class="note" style="margin:0">لن تُضاف صورة في أعلى README.</p>`;
  return `<div class="rd-card"><h4>🖼️ البانر (الصورة الإعلانية)</h4>${modes}<div style="height:12px"></div>${ban}</div>
    <div class="rd-card"><h4>📸 لقطات الشاشة <span style="color:var(--muted2);font-weight:400">(${RD.shots.length}/8)</span></h4>
      ${RD.shots.length?`<div class="rd-shots">${RD.shots.map((s,i)=>`<div class="rd-shot"><img src="${s.thumb}" alt="" /><button data-x="${i}" type="button">${icon("close",14)}</button></div>`).join("")}</div>`:""}
      <label class="rd-drop">${icon("plus",18)} إضافة لقطات<input type="file" accept="image/*" multiple id="rdShot" hidden /></label>
      <div class="field" style="margin-top:12px;margin-bottom:0"><label>نوع الشاشة</label>${rdSeg("data-sk","shotLayout",[["phone","هاتف (4 في الصف)"],["desk","سطح مكتب (2 في الصف)"]])}</div></div>`;
}
function rdF2(k,label,ph){ return `<div class="field"><label>${label}</label><input type="text" data-b="${k}" placeholder="${esc(ph)}" autocomplete="off" /></div>`; }

function rdFiles(){
  const t=state.tree||[], has=p=>t.some(x=>x.path===p), L=[];
  const rp=(t.find(x=>/^readme\.md$/i.test(x.path))||{}).path||"README.md";
  L.push([rp,has(rp)]);
  const bp=rdBannerPath(); if(bp) L.push([bp,has(bp)]);
  RD.shots.forEach((_,i)=>{ const p=rdShotPath(i); L.push([p,has(p)]); });
  if(RD.p.lic) L.push(["LICENSE",has("LICENSE")]);
  return L;
}
function rdTab2(){
  const canLic=RD.m.license==="MIT"&&!RD.hasLicense;
  return `<div class="rd-card"><h4>👁️ المعاينة</h4>
      <div class="seg2" style="margin-bottom:10px"><button type="button" data-view="pv" class="${RD.view==="pv"?"on":""}">معاينة</button><button type="button" data-view="code" class="${RD.view==="code"?"on":""}">كود Markdown</button><button type="button" data-view="th" style="flex:0 0 auto;padding:10px 14px">${RD.theme==="dark"?"🌙":"☀️"}</button></div>
      <div id="rdView"></div>
      <div class="rd-actions"><button class="btn btn-ghost btn-sm" id="rdCopy">${icon("copy",15)} نسخ README</button><button class="btn btn-ghost btn-sm" id="rdDl">${icon("download",15)} تنزيل README.md</button>${RD.manual!==null?`<button class="btn btn-ghost btn-sm" id="rdRegen">${icon("refresh",15)} إعادة التوليد</button>`:""}</div></div>
    <div class="rd-card"><h4>🚀 الرفع إلى المستودع</h4>
      <div class="dest" style="margin-bottom:10px">${esc(RD.ctx.owner)}/${esc(RD.ctx.name)} · ${esc(RD.ctx.branch)}</div>
      <div class="rd-files">${rdFiles().map(([p,ex])=>`<div><span>${esc(p)}</span>${ex?"<em>سيُستبدل</em>":"<i>جديد</i>"}</div>`).join("")}</div>
      <div class="field"><label>رسالة الـ commit</label><input type="text" data-p="msg" autocomplete="off" /></div>
      ${canLic?`<label class="rd-chk"><input type="checkbox" data-p="lic" /><span>إضافة ملف LICENSE (رخصة MIT باسم المطوّر)</span></label>`:""}
      <label class="rd-chk"><input type="checkbox" data-p="meta" /><span>تحديث وصف المستودع والـ Topics أيضًا</span></label>
      ${RD.p.meta?`<div class="field" style="margin-top:8px"><label>وصف المستودع (يظهر تحت اسمه في GitHub)</label><input type="text" data-p="mdesc" maxlength="350" autocomplete="off" /></div>
      <div class="field"><label>Topics (افصل بفاصلة، إنجليزية صغيرة)</label><input type="text" data-p="topics" dir="ltr" class="ltr" autocomplete="off" autocapitalize="off" /></div>`:""}
      <div class="inlineerr" id="rdErr"></div>
      <button class="btn btn-primary btn-block" id="rdGo" style="margin-top:8px">${icon("upload",17)} رفع README والصور</button>
      <p class="hint" style="margin-top:10px">لصورة المعاينة عند مشاركة الرابط: من GitHub افتح Settings ← Social preview وارفع البانر يدويًا (لا يمكن ضبطها عبر الـ API).</p></div>`;
}
function rdView(){
  const v=document.getElementById("rdView"); if(!v) return;
  const md=rdFinalMd();
  if(RD.view==="code"){
    v.innerHTML=`<textarea class="rd-code" id="rdCode" spellcheck="false"></textarea><div class="hint">يمكنك تعديل الكود يدويًا قبل الرفع. أي تعديل يوقف التوليد التلقائي حتى تضغط «إعادة التوليد».</div>`;
    const ta=v.querySelector("#rdCode"); ta.value=md;
    ta.addEventListener("input",()=>{ const first=RD.manual===null; RD.manual=ta.value; if(first) rdPane(false); });
  }else{
    v.innerHTML=`<iframe class="rd-frame" sandbox="allow-popups"></iframe>`;
    v.firstChild.srcdoc=rdPreviewDoc(md,RD.theme);
  }
}
async function rdPane(redraw=true){
  const pane=document.getElementById("rdPane"); if(!pane) return;
  const sc=pane.scrollTop;
  pane.innerHTML=[rdTab0,rdTab1,rdTab2][RD.tab]();
  rdBind(pane);
  document.querySelectorAll("#rdTabs button").forEach((b,i)=>b.classList.toggle("on",i===RD.tab));
  if(RD.tab===0){
    pane.querySelector("#rdAuto").addEventListener("click",()=>rdAutofill(true));
    pane.querySelector("#rdSample").addEventListener("click",()=>{ Object.assign(RD.m,RD_SAMPLE,{name:RD.m.name||RD.ctx.name,author:RD.m.author||state.username||""}); rdSave(); rdPane(); toast("تمت تعبئة مثال، عدّله كما تشاء","success"); });
  }
  if(RD.tab===1){
    const cv=pane.querySelector("#rdCv"); if(cv&&redraw) rdDrawBanner(cv);
    const lg=pane.querySelector("#rdLogo"); if(lg) lg.addEventListener("change",async()=>{ const f=lg.files[0]; if(!f) return; const u=URL.createObjectURL(f), im=new Image(); im.onload=()=>{ RD.logo={img:im}; rdPane(); }; im.onerror=()=>toast("تعذّر قراءة الصورة","error"); im.src=u; });
    const lx=pane.querySelector("#rdLogoX"); if(lx) lx.addEventListener("click",()=>{ RD.logo=null; rdPane(); });
    const up=pane.querySelector("#rdUp"); if(up) up.addEventListener("change",async()=>{ const f=up.files[0]; if(!f) return;
      const u8=new Uint8Array(await f.arrayBuffer()), ext=rdFileExt(f), th=ext==="svg"?{url:"data:image/svg+xml;base64,"+bytesToB64(u8)}:await rdThumb(f,1280);
      RD.up={bytes:u8,ext,thumb:th.url}; RD.bannerThumb=th.url; rdPane(); });
    const bd=pane.querySelector("#rdBanDl"); if(bd) bd.addEventListener("click",async()=>{ const u8=await rdBannerBytes(); triggerDownload(new Blob([u8],{type:"image/png"}),"banner.png"); });
    const sh=pane.querySelector("#rdShot"); if(sh) sh.addEventListener("change",async()=>{
      for(const f of [...sh.files]){ if(RD.shots.length>=8){ toast("الحد الأقصى 8 لقطات","error"); break; }
        const u8=new Uint8Array(await f.arrayBuffer()), th=await rdThumb(f,520); RD.shots.push({bytes:u8,ext:rdFileExt(f),thumb:th.url||""}); }
      rdPane(); });
    pane.querySelectorAll("[data-x]").forEach(b=>b.addEventListener("click",()=>{ RD.shots.splice(+b.dataset.x,1); rdPane(); }));
  }
  if(RD.tab===2){
    rdView();
    pane.querySelectorAll("[data-view]").forEach(b=>b.addEventListener("click",()=>{ if(b.dataset.view==="th"){ RD.theme=RD.theme==="dark"?"light":"dark"; rdPane(); return; } RD.view=b.dataset.view; rdPane(); }));
    pane.querySelector("#rdCopy").addEventListener("click",()=>copyText(rdFinalMd()).then(ok=>toast(ok?"تم نسخ README":"تعذّر النسخ",ok?"success":"error")));
    pane.querySelector("#rdDl").addEventListener("click",()=>triggerDownload(new Blob([rdFinalMd()],{type:"text/markdown;charset=utf-8"}),"README.md"));
    const rg=pane.querySelector("#rdRegen"); if(rg) rg.addEventListener("click",()=>{ RD.manual=null; rdPane(); });
    pane.querySelector("#rdGo").addEventListener("click",ev=>rdPublish(ev.currentTarget));
  }
  pane.scrollTop=sc;
}
async function rdAutofill(manual){
  const ctx=RD.ctx, m=RD.m, set=(k,v)=>{ if(v&&!String(m[k]||"").trim()){ m[k]=v; return true; } return false; };
  let ch=false;
  ch|=set("name",ctx.name); ch|=set("author",state.username||ctx.owner);
  ch|=set("desc",state.repo.description||""); ch|=set("tech",state.repo.language||"");
  const [rel,pg]=await Promise.all([gh(`/repos/${ctx.owner}/${ctx.name}/releases/latest`).catch(()=>null),gh(`/repos/${ctx.owner}/${ctx.name}/pages`).catch(()=>null)]);
  if(rel) ch|=set("dl",`https://github.com/${ctx.owner}/${ctx.name}/releases/latest`);
  if(pg&&pg.html_url) ch|=set("demo",pg.html_url);
  if(!RD.p.mdesc) RD.p.mdesc=state.repo.description||"";
  if(ch){ rdSave(); if(RD&&RD.tab===0) rdPane(); }
  if(manual) toast(ch?"تمت التعبئة من بيانات المستودع":"لا توجد بيانات جديدة لتعبئتها",ch?"success":"info");
}
function rdTopicsDefault(){
  return rdList(RD.m.tech).map(t=>t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")).filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,20).join(", ");
}
async function rdPublish(btn){
  const err=document.getElementById("rdErr"); err.style.display="none";
  const ctx=RD.ctx, p=RD.p;
  const label=btn.innerHTML; busy(btn,"جارٍ الرفع...");
  try{
    const entries=[], add=async(path,b64)=>{ const bl=await createBlob(ctx,b64); entries.push({path,mode:"100644",type:"blob",sha:bl.sha}); };
    const files=rdFiles();
    await add(files[0][0],bytesToB64(new TextEncoder().encode(rdFinalMd())));
    const bp=rdBannerPath();
    if(bp){ const u8=RD.b.mode==="gen"?await rdBannerBytes():RD.up.bytes; await add(bp,bytesToB64(u8)); }
    for(let i=0;i<RD.shots.length;i++) await add(rdShotPath(i),bytesToB64(RD.shots[i].bytes));
    if(p.lic){ const txt=`MIT License\n\nCopyright (c) ${new Date().getFullYear()} ${(RD.m.author||ctx.owner).trim()}\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the "Software"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n`; await add("LICENSE",bytesToB64(new TextEncoder().encode(txt))); }
    const cm=await withRetry(()=>commitEntries(entries,(p.msg||"docs: README احترافي").trim(),ctx),3);
    let warn="";
    if(p.meta){
      try{
        if((p.mdesc||"").trim()) await gh(`/repos/${ctx.owner}/${ctx.name}`,{method:"PATCH",body:JSON.stringify({description:p.mdesc.trim().slice(0,350)})});
        const names=rdList(p.topics).map(t=>t.toLowerCase().replace(/[^a-z0-9-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,50)).filter(Boolean).slice(0,20);
        if(names.length) await gh(`/repos/${ctx.owner}/${ctx.name}/topics`,{method:"PUT",body:JSON.stringify({names})});
      }catch(x){ warn=" (تعذّر تحديث الوصف/Topics: "+em(x)+")"; }
    }
    toast("تم رفع README والصور"+warn,warn?"info":"success");
    loadTree(cm.tree.sha);
    btn.disabled=false; btn.innerHTML=label;
    const done=openSheet(`<h3>تم الرفع ✅</h3><p class="note">أصبح README الجديد في المستودع. افتح صفحة المستودع في GitHub لتراه.</p><div class="dest">github.com/${esc(ctx.owner)}/${esc(ctx.name)}</div><div class="row"><button class="btn btn-ghost" id="c">إغلاق</button><a class="btn btn-primary" href="https://github.com/${esc(ctx.owner)}/${esc(ctx.name)}" target="_blank" rel="noopener">فتح في GitHub</a></div>`);
    wireSheet(done);
  }catch(x){
    err.style.display="block"; err.textContent=em(x)+(x.status===404?" — إن كان المستودع فارغًا فأضف إليه ملفًا واحدًا أولًا.":"");
    btn.disabled=false; btn.innerHTML=label;
  }
}
function rdHelp(){
  const o=sh("كيف يعمل README في GitHub؟",`<ul class="rd-help" style="padding-inline-start:18px;margin:0">
    <li>ملف <code>README.md</code> في جذر المستودع يعرضه GitHub تلقائيًا أسفل الملفات.</li>
    <li>يُكتب بلغة <b>Markdown</b> ويقبل أيضًا وسوم <b>HTML</b> محدودة مثل <code>&lt;div align="center"&gt;</code> و <code>&lt;img&gt;</code> و <code>&lt;table&gt;</code>. لا يعمل CSS ولا JavaScript.</li>
    <li>الصور مجرد ملفات في المستودع (مجلد <code>assets/</code>) تُستدعى بمسار نسبي: <code>&lt;img src="assets/banner.png"&gt;</code>.</li>
    <li>الشارات الملوّنة (Badges) صور تُولَّد من موقع shields.io عبر رابط.</li>
    <li>الاستوديو يبني كل هذا من وصفك ثم يرفع README والصور في commit واحد.</li>
  </ul>`);
  return o;
}
function openReadmeStudio(){
  if(!state.repo||!state.branch) return toast("افتح مستودعًا أولًا","error");
  const ctx=curCtx();
  RD={ctx,tab:0,view:"pv",theme:"dark",manual:null,drawTok:0,logo:null,up:null,shots:[],bannerThumb:null,
    hasLicense:(state.tree||[]).some(t=>/^license(\.md|\.txt)?$/i.test(t.path)),
    m:{lang:"ar",name:"",tag:"",desc:"",feats:"",featStyle:"list",steps:"",tech:"",dl:"",demo:"",links:"",license:"",author:"",repoBadges:true,shotLayout:"phone"},
    b:{mode:"gen",theme:0,pattern:"grid",title:"",sub:"",showTech:true,showRepo:true},
    p:{msg:"docs: README احترافي مع بانر",meta:false,mdesc:"",topics:"",lic:false}};
  rdLoadDraft();
  const o=el(`<div class="rd"><div class="rd-in">
    <div class="appbar"><button class="iconbtn" id="rdX">${icon("back",19)}</button><div style="min-width:0;flex:1"><h1>استوديو README</h1><div class="sub">${esc(ctx.owner)}/${esc(ctx.name)}</div></div><div class="appbar-actions"><button class="iconbtn" id="rdQ" style="font-weight:700;font-size:16px">؟</button></div></div>
    <div class="rd-tabs"><div class="seg" id="rdTabs"><button data-t="0">١ المحتوى</button><button data-t="1">٢ الصور</button><button data-t="2">٣ المعاينة والنشر</button></div></div>
    <div class="rd-body" id="rdPane"></div></div></div>`);
  document.body.appendChild(o);
  o.querySelector("#rdX").addEventListener("click",()=>{ RD&&(RD.drawTok=-1e9); o.remove(); RD=null; });
  o.querySelector("#rdQ").addEventListener("click",rdHelp);
  o.querySelector("#rdTabs").addEventListener("click",ev=>{ const b=ev.target.closest("[data-t]"); if(!b) return; RD.tab=+b.dataset.t; if(RD.tab===2&&!RD.p.mdesc) RD.p.mdesc=RD.m.tag||state.repo.description||""; if(RD.tab===2&&!RD.p.topics) RD.p.topics=rdTopicsDefault(); rdPane(); });
  rdPane();
  rdAutofill(false);
}

</script>
</body>
</html>
