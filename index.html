<style>
  :root{
    --bg:#030818; --bg2:#070e24; --panel:#0b1330; --panel2:#111b3d; --panel3:#182349;
    --line:#18234a; --line2:#25336a;
    --text:#eaf0ff; --muted:#8f9cc4; --muted2:#5c6a98;
    --c1:#22d3ee; --c2:#3b82f6; --c3:#8b5cf6;
    --grad:linear-gradient(135deg,#22d3ee 0%,#3b82f6 48%,#8b5cf6 100%);
    --grad-soft:linear-gradient(135deg,rgba(34,211,238,.16),rgba(59,130,246,.16) 50%,rgba(139,92,246,.18));
    --accent:#5b8cff; --accent-bg:rgba(91,140,255,.14);
    --danger:#ff5d73; --danger-bg:rgba(255,93,115,.1);
    --warn:#f5b544; --warn-bg:rgba(245,181,68,.12);
    --ok:#34d399;
    --radius:16px;
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans Arabic', Tahoma, sans-serif; display:flex; justify-content:center; }
  #shell{
    width:100%; max-width:460px; min-height:100vh; min-height:100dvh; position:relative; display:flex; flex-direction:column;
    background:
      radial-gradient(420px 260px at 100% -40px, rgba(59,130,246,.20), transparent 70%),
      radial-gradient(380px 260px at 0% -30px, rgba(139,92,246,.16), transparent 70%),
      var(--bg);
    border-inline:1px solid var(--line);
  }
  @media (min-width:520px){
    body{ padding:24px 0; }
    #shell{ min-height:calc(100vh - 48px); border-radius:30px; overflow:hidden; box-shadow:0 40px 90px rgba(0,0,20,.7), 0 0 0 1px var(--line); border:none; }
  }
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:var(--line2); border-radius:99px;}
  .screen{ display:flex; flex-direction:column; height:100vh; height:100dvh; position:relative; }
  @media (min-width:520px){ .screen{ height:calc(100vh - 48px); } }

  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;} }
  @keyframes slideUp{ from{transform:translateY(40px); opacity:0;} to{transform:none; opacity:1;} }
  @keyframes fadeIn{ from{opacity:0;} to{opacity:1;} }
  @keyframes shimmer{ 100%{ transform:translateX(-100%);} }
  @keyframes spin{ to{ transform:rotate(360deg);} }
  @keyframes glow{ 0%,100%{ opacity:.55; transform:scale(1);} 50%{ opacity:.9; transform:scale(1.08);} }

  .appbar{ display:flex; align-items:center; gap:10px; padding:calc(12px + var(--safe-t)) 14px 12px; background:rgba(7,14,36,.78); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-bottom:1px solid var(--line); flex-shrink:0; z-index:5; }
  .appbar h1{ font-size:15.5px; font-weight:700; margin:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .appbar .sub{ font-size:11px; color:var(--muted2); font-family:'JetBrains Mono',monospace; direction:ltr; text-align:right; margin-top:1px; }
  .appbar-actions{ display:flex; gap:4px; align-items:center; }
  .applogo{ width:34px; height:34px; border-radius:10px; flex-shrink:0; box-shadow:0 0 0 1px var(--line2), 0 6px 18px rgba(59,130,246,.35); }

  .iconbtn{ display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:11px; background:transparent; border:1px solid transparent; color:var(--muted); cursor:pointer; transition:.15s; flex-shrink:0; }
  .iconbtn:hover{ background:var(--panel2); color:var(--text); }
  .iconbtn:active{ transform:scale(.92); }
  .iconbtn.danger:hover{ color:var(--danger); background:var(--danger-bg); }
  .iconbtn.sm{ width:32px; height:32px; border-radius:10px; background:var(--panel2); border-color:var(--line); }

  main{ flex:1; overflow-y:auto; display:flex; flex-direction:column; min-height:0; }

  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:13px; padding:12px 18px; font-size:14px; font-weight:600; cursor:pointer; transition:.18s; font-family:inherit; }
  .btn:active{ transform:scale(.97); }
  .btn-primary{ background:var(--grad); color:#fff; box-shadow:0 8px 22px rgba(59,130,246,.35); }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-primary:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; filter:none; }
  .btn-ghost{ background:var(--panel2); color:var(--text); border:1px solid var(--line2); }
  .btn-ghost:hover{ background:var(--panel3); }
  .btn-ghost:disabled{ opacity:.5; }
  .btn-danger{ background:linear-gradient(135deg,#ff5d73,#e0344f); color:#fff; box-shadow:0 8px 22px rgba(255,93,115,.28); }
  .btn-danger:disabled{ opacity:.35; box-shadow:none; cursor:not-allowed; }
  .btn-danger-soft{ background:var(--danger-bg); color:#ff9aa9; border:1px solid rgba(255,93,115,.3); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:9px 12px; font-size:12.5px; border-radius:11px; }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .input-wrap{ position:relative; }
  input[type=text], input[type=password], input[type=search]{ width:100%; background:var(--panel); border:1px solid var(--line2); color:var(--text); border-radius:13px; padding:12px 14px; font-size:14px; outline:none; font-family:inherit; transition:.15s; }
  input::placeholder{ color:var(--muted2); }
  input:focus{ border-color:var(--c2); box-shadow:0 0 0 3px rgba(59,130,246,.2); }
  .input-wrap .iconbtn{ position:absolute; left:4px; top:4px; width:32px; height:32px; }
  .input-wrap input{ padding-left:40px; }

  /* Login */
  .login-screen{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 24px; animation:fadeUp .5s both; }
  .hero{ display:flex; flex-direction:column; align-items:center; text-align:center; margin-bottom:26px; }
  .hero .logo-wrap{ position:relative; width:104px; height:104px; margin-bottom:18px; }
  .hero .logo-wrap::before{ content:''; position:absolute; inset:-18px; background:var(--grad); filter:blur(34px); opacity:.55; border-radius:50%; animation:glow 4s ease-in-out infinite; }
  .hero .logo-wrap img{ position:relative; width:100%; height:100%; border-radius:28px; box-shadow:0 0 0 1px var(--line2), 0 18px 40px rgba(0,0,30,.6); }
  .hero h2{ font-size:28px; margin:0 0 8px; font-weight:700; letter-spacing:.3px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-family:'JetBrains Mono','IBM Plex Sans Arabic',monospace; }
  .hero p{ color:var(--muted); font-size:13px; margin:0; line-height:1.8; max-width:330px; }
  .perm-box{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:18px; }
  .perm-box .t{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-bottom:8px; }
  .perm-box .r{ font-size:11.5px; color:var(--muted); line-height:1.9; }
  .perm-box code{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--c1); direction:ltr; display:inline-block; background:rgba(34,211,238,.08); padding:1px 7px; border-radius:6px; }
  .error-msg{ display:flex; align-items:flex-start; gap:8px; background:var(--danger-bg); border:1px solid rgba(255,93,115,.3); color:#ffb3bd; font-size:12.5px; padding:10px 12px; border-radius:12px; margin-bottom:14px; line-height:1.6; }

  /* ===== Saved accounts ===== */
  .login-screen{ overflow-y:auto; justify-content:flex-start; }
  .login-screen > :first-child{ margin-top:auto; }
  .login-screen::after{ content:''; margin-top:auto; flex-shrink:0; height:1px; }
  .login-screen > *{ flex-shrink:0; }
  .hero.compact{ margin-bottom:16px; }
  .hero.compact .logo-wrap{ width:76px; height:76px; margin-bottom:12px; }
  .hero.compact .logo-wrap img{ border-radius:21px; }
  .hero.compact h2{ font-size:23px; margin-bottom:6px; }
  .sec-label{ display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin:0 2px 8px; font-weight:600; }
  .acclist{ display:flex; flex-direction:column; gap:8px; }
  .acc{ display:flex; align-items:center; gap:6px; background:linear-gradient(180deg,var(--panel),rgba(11,19,48,.6)); border:1px solid var(--line); border-radius:var(--radius); padding:8px 8px 8px 10px; animation:fadeUp .35s both; transition:border-color .15s; }
  .acc:hover{ border-color:var(--line2); }
  .acc.loading{ border-color:var(--c2); box-shadow:0 0 0 3px rgba(59,130,246,.15); }
  .acc.lock{ pointer-events:none; opacity:.6; }
  .acc.loading.lock{ opacity:1; }
  .acc-main{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; background:none; border:none; color:inherit; font-family:inherit; text-align:right; cursor:pointer; padding:2px; }
  .acc-main:active{ transform:scale(.98); }
  .acc-av{ position:relative; width:44px; height:44px; border-radius:14px; background:var(--grad); display:flex; align-items:center; justify-content:center; flex-shrink:0; overflow:hidden; font-weight:700; font-size:17px; color:#fff; font-family:'JetBrains Mono','IBM Plex Sans Arabic',monospace; box-shadow:0 0 0 1px var(--line2); }
  .acc-av img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; background:var(--panel2); }
  .acc-body{ flex:1; min-width:0; }
  .acc-name{ font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-login{ font-size:11.5px; color:var(--muted2); margin-top:2px; font-family:'JetBrains Mono',monospace; direction:ltr; text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .acc-go{ color:var(--muted2); display:flex; transform:scaleX(-1); }
  .acc-go .spinner{ border-color:rgba(255,255,255,.2); border-top-color:var(--c1); }
  /* ===== Lock screen ===== */
  .lockov{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:20px; overflow:auto; animation:fadeIn .2s both;
    background:radial-gradient(420px 260px at 100% -40px, rgba(59,130,246,.22), transparent 70%), radial-gradient(380px 260px at 0% -30px, rgba(139,92,246,.18), transparent 70%), var(--bg); }
  .lk{ width:100%; max-width:330px; text-align:center; margin:auto; }
  .lk img{ width:76px; height:76px; border-radius:22px; box-shadow:0 0 0 1px var(--line2), 0 14px 36px rgba(59,130,246,.4); }
  .lk h2{ margin:14px 0 4px; font-size:24px; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; font-family:'JetBrains Mono',monospace; }
  .lk-msg{ font-size:13px; color:var(--muted); min-height:20px; margin:4px 0 18px; }
  .lk-dots{ display:flex; gap:13px; justify-content:center; margin-bottom:24px; direction:ltr; }
  .lk-dots i{ width:13px; height:13px; border-radius:99px; border:1.5px solid var(--line2); transition:.12s; }
  .lk-dots i.on{ background:var(--grad); border-color:transparent; box-shadow:0 0 12px rgba(59,130,246,.7); }
  .lk-dots.shake{ animation:shake .35s; }
  @keyframes shake{ 20%,60%{ transform:translateX(-9px);} 40%,80%{ transform:translateX(9px);} }
  .lk-pad{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; direction:ltr; }
  .lk-pad button{ height:62px; border-radius:20px; background:var(--panel2); border:1px solid var(--line2); color:var(--text); font-size:22px; font-family:'JetBrains Mono',monospace; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.1s; }
  .lk-pad button:active{ background:var(--accent-bg); border-color:var(--c2); transform:scale(.94); }
  .lk-pad button.ghost{ background:transparent; border-color:transparent; color:var(--muted); }
  /* ===== Actions ===== */
  .rbadge.ok{ background:rgba(52,211,153,.1); color:var(--ok); border-color:rgba(52,211,153,.25); }
  .rbadge.bad{ background:var(--danger-bg); color:#ff9aa9; border-color:rgba(255,93,115,.3); }
  .rbadge.run{ background:rgba(34,211,238,.1); color:var(--c1); border-color:rgba(34,211,238,.3); }
  .rbadge.wait{ background:var(--warn-bg); color:var(--warn); border-color:rgba(245,181,68,.3); }
  .rbadge.off{ background:var(--panel3); color:var(--muted); border-color:var(--line2); }
  .spin{ animation:spin 1s linear infinite; }
  .runcard{ position:relative; display:block; width:100%; text-align:right; background:linear-gradient(180deg,var(--panel),rgba(11,19,48,.6)); border:1px solid var(--line); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px; cursor:pointer; color:var(--text); font-family:inherit; overflow:hidden; animation:fadeUp .35s both; transition:.15s; }
  .runcard::before{ content:''; position:absolute; inset-block:0; inset-inline-start:0; width:3px; background:var(--kc); }
  .runcard:hover{ border-color:var(--line2); } .runcard:active{ transform:scale(.99); }
  .rc-top{ display:flex; align-items:center; gap:8px; }
  .rc-ic{ color:var(--kc); display:flex; flex-shrink:0; }
  .rc-title{ flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rc-sub{ font-size:12px; color:var(--muted); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stps{ margin-top:12px; display:flex; flex-direction:column; gap:2px; }
  .stp{ display:flex; align-items:center; gap:8px; font-size:12px; padding:4px 2px; color:var(--muted); }
  .stp .stp-i{ display:flex; width:16px; justify-content:center; color:var(--muted2); }
  .stp.ok .stp-i{ color:var(--ok); } .stp.bad .stp-i{ color:var(--danger); } .stp.bad .stp-n{ color:#ffb3bd; } .stp.run .stp-i{ color:var(--c1); }
  .stp-n{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:ltr; text-align:right; }
  .stp-d{ font-size:11px; font-family:'JetBrains Mono',monospace; color:var(--muted2); direction:ltr; }
  .logbox{ direction:ltr; text-align:left; font-family:'JetBrains Mono',monospace; font-size:11px; line-height:1.55; background:var(--bg2); border:1px solid var(--line); border-radius:12px; padding:8px; max-height:52vh; overflow:auto; margin-bottom:10px; }
  .logbox div{ white-space:pre; min-width:max-content; }
  .logbox .le{ color:#ffb3bd; background:rgba(255,93,115,.1); } .logbox .lw{ color:var(--warn); } .logbox .lg2{ color:var(--c1); }
  /* Repos */
  .search-bar{ padding:12px 14px 4px; flex-shrink:0; }
  .seg{ display:flex; gap:4px; background:var(--panel); border:1px solid var(--line); border-radius:13px; padding:4px; margin-top:10px; }
  .seg button{ flex:1; background:transparent; border:none; color:var(--muted); font-family:inherit; font-size:12.5px; padding:8px 6px; border-radius:10px; cursor:pointer; transition:.15s; display:flex; align-items:center; justify-content:center; gap:6px; }
  .seg button b{ font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:600; background:var(--panel3); padding:1px 7px; border-radius:99px; color:var(--muted); }
  .seg button.on{ background:var(--grad-soft); color:var(--text); box-shadow:inset 0 0 0 1px var(--line2); }
  .seg button.on b{ background:var(--grad); color:#fff; }
  .list{ padding:10px 12px 110px; }
  .rcard{ background:linear-gradient(180deg,var(--panel),rgba(11,19,48,.6)); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:10px; overflow:hidden; animation:fadeUp .4s both; transition:border-color .15s; }
  .rcard:hover{ border-color:var(--line2); }
  .rrow{ display:flex; align-items:center; gap:8px; padding:12px 12px 12px 10px; }
  .rmain{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; cursor:pointer; background:none; border:none; color:inherit; font-family:inherit; text-align:right; padding:0; }
  .ric{ width:42px; height:42px; border-radius:13px; background:var(--grad-soft); box-shadow:inset 0 0 0 1px var(--line2); display:flex; align-items:center; justify-content:center; color:var(--c1); flex-shrink:0; }
  .rbody{ flex:1; min-width:0; }
  .rtop{ display:flex; align-items:center; gap:6px; }
  .rname{ font-size:14px; font-weight:600; direction:ltr; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rdesc{ font-size:12px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rmeta{ display:flex; align-items:center; gap:10px; font-size:11px; color:var(--muted2); margin-top:6px; }
  .rmeta .l{ display:inline-flex; align-items:center; gap:5px; }
  .rmeta .d{ width:8px; height:8px; border-radius:99px; }
  .racts{ display:flex; flex-direction:column; gap:6px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:2px 8px; border-radius:99px; flex-shrink:0; border:1px solid transparent; }
  .badge.priv{ background:var(--warn-bg); color:var(--warn); }
  .badge.pub{ background:rgba(52,211,153,.1); color:var(--ok); }

  .empty{ text-align:center; padding:70px 24px; color:var(--muted2); animation:fadeIn .4s both; }
  .empty .ic{ margin:0 auto 14px; opacity:.5; }
  .empty p{ font-size:13px; line-height:1.8; margin:0; }
  .spinner{ width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.25); border-top-color:#fff; animation:spin .7s linear infinite; display:inline-block; }

  .sk{ position:relative; overflow:hidden; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); height:78px; margin-bottom:10px; }
  .sk.tall{ height:168px; }
  .sk::after{ content:''; position:absolute; inset:0; transform:translateX(100%); background:linear-gradient(90deg,transparent,rgba(91,140,255,.09),transparent); animation:shimmer 1.3s infinite; }

  .toolbar{ display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); background:rgba(7,14,36,.5); flex-shrink:0; }
  .pill-select{ position:relative; }
  .pill-select select{ appearance:none; background:var(--panel2); border:1px solid var(--line2); color:var(--text); border-radius:99px; padding:7px 30px 7px 12px; font-size:12.5px; font-family:'JetBrains Mono',monospace; direction:ltr; max-width:190px; }

  .relbar{ display:none; height:6px; border-radius:99px; background:var(--panel3); overflow:hidden; margin-top:8px; }
  .relbar.on{ display:block; }
  .relbar i{ display:block; height:100%; width:0; background:var(--grad); transition:width .2s; }
  .relst{ font-size:11.5px; color:var(--muted); margin-top:6px; display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .relst:empty{ display:none; }
  .relst.ok{ color:var(--ok); }
  .upitem .errline:empty{ display:none; }
  .rellink{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted2); direction:ltr; text-align:left; margin-top:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rellabel{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted); margin-bottom:6px; }
  .upitem .warnline{ display:block; line-height:1.7; }
  .upitem .warnline div{ font-size:11.5px; }

  /* ===== README Studio ===== */
  .overlay{z-index:70}
  .rd{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:var(--bg);animation:fadeIn .2s both}
  .rd-in{width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;background:var(--bg);border-inline:1px solid var(--line)}
  .rd-tabs{padding:0 14px 10px}
  .rd-tabs .seg{margin-top:0}
  .rd-body{flex:1;overflow-y:auto;padding:4px 14px calc(28px + var(--safe-b))}
  .rd-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
  .rd-card h4{margin:0 0 12px;font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px}
  .rd .field label{display:flex;justify-content:space-between;gap:8px}
  .rd textarea,.rd select{width:100%;background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:13px;padding:11px 13px;font-size:13.5px;outline:none;font-family:inherit;line-height:1.8;resize:vertical;transition:.15s}
  .rd textarea:focus,.rd select:focus{border-color:var(--c2);box-shadow:0 0 0 3px rgba(59,130,246,.2)}
  .rd textarea::placeholder{color:var(--muted2)}
  .rd select{appearance:none;padding-inline-end:12px}
  .rd .ltr{direction:ltr;text-align:left}
  .rd .hint{font-size:11.5px;color:var(--muted2);margin-top:5px;line-height:1.7}
  .rd-chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.7;margin:6px 0;cursor:pointer}
  .rd-chk input{margin-top:5px;accent-color:#3b82f6;width:16px;height:16px;flex-shrink:0}
  .rd-sw{display:flex;gap:8px;flex-wrap:wrap}
  .rd-sw button{width:40px;height:40px;border-radius:12px;border:2px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line2)}
  .rd-sw button.on{border-color:#fff}
  .rd canvas{width:100%;height:auto;border-radius:12px;border:1px solid var(--line2);display:block;background:var(--bg2)}
  .rd-shots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
  .rd-shot{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:var(--bg2)}
  .rd-shot img{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
  .rd-shot button{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:8px;border:none;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .rd-code{min-height:360px;direction:ltr;text-align:left;font-family:'JetBrains Mono',monospace !important;font-size:12px !important;line-height:1.6 !important;white-space:pre}
  .rd-frame{width:100%;height:58vh;border:1px solid var(--line2);border-radius:12px;background:#fff;display:block}
  .rd-files{font-family:'JetBrains Mono',monospace;font-size:11.5px;direction:ltr;text-align:left;display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .rd-files div{display:flex;justify-content:space-between;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:6px 10px}
  .rd-files em{font-style:normal;color:var(--warn)}
  .rd-files i{font-style:normal;color:var(--ok)}
  .rd-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .rd-actions .btn{flex:1;white-space:nowrap}
  .rd-drop{display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px dashed var(--line2);border-radius:13px;padding:14px;color:var(--muted);font-size:13px;cursor:pointer;background:var(--bg2);text-align:center}
  .rd-drop:hover{border-color:var(--c2);color:var(--text)}
  .rd-help li{margin-bottom:8px;line-height:1.8;font-size:13px}
  .rd-help code{font-family:'JetBrains Mono',monospace;direction:ltr;display:inline-block;background:var(--bg2);padding:0 6px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<div id="shell"></div>
<div id="toasts"></div>
<input type="file" id="filePicker" multiple hidden />

function extOf(p){ const n=p.split("/").pop(); const i=n.lastIndexOf("."); return i>0 ? n.slice(i+1).toLowerCase() : ""; }
function kindOf(name){
  const ext = extOf(name), low = name.toLowerCase();
  if(low==="dockerfile") return {label:"Docker", color:"#2496ed", text:true};
  if(low==="makefile") return {label:"Makefile", color:"#8a8a8a", text:true};
  if(LANGS[ext]) return {label:LANGS[ext][0], color:LANGS[ext][1], text:true};
  if(BIN[ext]) return {label:BIN[ext], color:"#8f9cc4", text:false};
  if(!ext) return {label:"ملف", color:"#8f9cc4", text:true};
  return {label:ext.toUpperCase(), color:"#8f9cc4", text:true};
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function timeAgo(iso){
  if(!iso) return "";
  const d=(Date.now()-new Date(iso).getTime())/1000;
  if(d<60) return "الآن";
  if(d<3600) return `منذ ${Math.floor(d/60)} د`;
  if(d<86400) return `منذ ${Math.floor(d/3600)} س`;
  if(d<2592000) return `منذ ${Math.floor(d/86400)} يوم`;
  return new Date(iso).toLocaleDateString("ar");

/* ========================= GITHUB API ========================= */
const API="https://api.github.com";
function mapStatus(s){
  return ({
    401:"التوكن غير صالح أو منتهي الصلاحية.",
    403:"صلاحيات غير كافية، أو تم تجاوز حد الطلبات (Rate Limit).",
    404:"غير موجود. تحقق من المسار أو المستودع أو الفرع.",
    409:"تعارض: تغيّر المستودع أثناء العملية. أعد التحديث وحاول مجدداً.",
    422:"طلب غير صالح، تحقق من البيانات.",
  })[s] || `حدث خطأ غير متوقع (${s}).`;
}
function headers(extra){
  return {"Authorization":`Bearer ${state.token}`,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28",...(extra||{})};
}
async function gh(path, options={}){
  const res = await fetch(`${API}${path}`, {...options, cache:"no-store", headers: headers(options.body?{"Content-Type":"application/json"}:{})});
  const rem=res.headers.get("x-ratelimit-remaining"), lim=res.headers.get("x-ratelimit-limit");
  if(rem!==null) state.rateLimit={remaining:Number(rem), limit:Number(lim)};
  if(!res.ok){
    let detail="",errs=null; try{ const j=await res.json(); detail=j.message||""; errs=j.errors||null; }catch{}
    if(res.status===401) logout(true);
    const err=new Error(mapStatus(res.status)); err.status=res.status; err.detail=detail; err.errors=errs;
    if((res.status===403||res.status===429) && (rem==="0" || /rate limit/i.test(detail))){
      err.rate=true; const rs=res.headers.get("x-ratelimit-reset");
      const mins=rs?Math.max(1,Math.ceil((Number(rs)*1000-Date.now())/60000)):null;
      err.message="تم تجاوز حد الطلبات (Rate Limit)."+(mins?` حاول بعد ${mins} دقيقة.`:" حاول لاحقاً.");
    }
    throw err;
  }
  if(res.status===204) return null;
  return res.json();
}
function mapRepo(r){
  return {id:r.id,name:r.name,fullName:r.full_name,owner:r.owner.login,private:r.private,defaultBranch:r.default_branch,description:r.description,updatedAt:r.pushed_at||r.updated_at,language:r.language,size:r.size||0};
}
async function apiListRepos(){
  let all=[], page=1;
  while(true){
    const chunk=await gh(`/user/repos?per_page=100&page=${page}&sort=updated&affiliation=owner,collaborator,organization_member`);
    all=all.concat(chunk);
    if(chunk.length<100||page>=30) break;
    page++;
  }
  return all;
}
async function apiTree(owner,repo,branch,treeSha){
  if(!treeSha){
    const b=await gh(`/repos/${owner}/${repo}/branches/${encodeURIComponent(branch)}`);
    treeSha=b.commit.commit.tree.sha;
  }
  return gh(`/repos/${owner}/${repo}/git/trees/${treeSha}?recursive=1`);
}
async function countLines(sha,ctx){
  const {owner,name}=ctx||state.repo;
  const res=await fetch(`${API}/repos/${owner}/${name}/git/blobs/${sha}`,{cache:"no-store",headers:headers({"Accept":"application/vnd.github.raw+json"})});
  if(!res.ok) throw new Error("blob");
  const u8=new Uint8Array(await res.arrayBuffer());
  if(u8.length===0) return 0;
  let n=0;
  for(let i=0;i<u8.length;i++) if(u8[i]===10) n++;
  if(u8[u8.length-1]!==10) n++;
  return n;
}
async function lastCommitDate(path,ctx){
  ctx=ctx||curCtx(); const {owner,name}=ctx;
  const data=await gh(`/repos/${owner}/${name}/commits?sha=${encodeURIComponent(ctx.branch)}&path=${encodeURIComponent(path)}&per_page=1`);
  if(!data.length) return null;
  return data[0].commit.committer?.date || data[0].commit.author?.date || null;
}
function curCtx(){ return {owner:state.repo.owner,name:state.repo.name,branch:state.branch}; }
async function createBlob(ctx,b64){
  const send=()=>gh(`/repos/${ctx.owner}/${ctx.name}/git/blobs`,{method:"POST",body:JSON.stringify({content:b64,encoding:"base64"})});
  try{ return await send(); }
  catch(e){
    if(e.status!==undefined) throw e;
    await sleep(1500);
    try{ return await send(); }
    catch(e2){
      if(e2.status!==undefined) throw e2;
      const mb=(b64.length*3/4/1048576).toFixed(1);
      const x=new Error(`فشل إرسال الملف (${mb}MB) إلى GitHub: ${e2.message||e2.name}. إن تكرر ذلك مع الملفات الكبيرة فجرّب شبكة أخرى أو أرفقه كمرفق Release.`);
      x.netFail=true; throw x;
    }
  }
}
async function commitEntries(entries, message, ctx){
  ctx=ctx||curCtx();
  const {owner,name}=ctx;
  const refPath=`heads/${encPath(ctx.branch)}`;
  const ref=await gh(`/repos/${owner}/${name}/git/ref/${refPath}`);
  const headSha=ref.object.sha;
  const head=await gh(`/repos/${owner}/${name}/git/commits/${headSha}`);
  const tree=await gh(`/repos/${owner}/${name}/git/trees`,{method:"POST",body:JSON.stringify({base_tree:head.tree.sha, tree:entries})});
  const commit=await gh(`/repos/${owner}/${name}/git/commits`,{method:"POST",body:JSON.stringify({message, tree:tree.sha, parents:[headSha]})});
  await gh(`/repos/${owner}/${name}/git/refs/${refPath}`,{method:"PATCH",body:JSON.stringify({sha:commit.sha})});
  return commit;
}
async function withRetry(fn,tries=6){
  let last;
  for(let i=0;i<tries;i++){
    try{ return await fn(); }catch(e){ last=e; if(e.status!==404&&e.status!==409) throw e; await sleep(900); }
  }
  throw last;
}
async function fileToBase64(file){
  try{
    const u8=new Uint8Array(await file.arrayBuffer());
    const CH=3*16384, parts=[];
    for(let i=0;i<u8.length;i+=CH) parts.push(btoa(String.fromCharCode.apply(null,u8.subarray(i,i+CH))));
    return parts.join("");
  }catch(e1){ /* نرجع إلى FileReader */ }
  return fileToBase64Legacy(file);
}
function fileToBase64Legacy(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>{ const s=String(r.result); resolve(s.slice(s.indexOf(",")+1)); };
    r.onerror=()=>reject(Object.assign(new Error("تعذّر قراءة الملف من الجهاز. انسخه إلى مجلد التنزيلات (Download) ثم اخترْه من هناك."),{readFail:true}));
    r.readAsDataURL(file);
  });
}
function adminError(e,what){
  if(e.rate) return e.message;
  if(e.status===undefined) return e.message||"فشلت العملية";
  const d=e.detail?` (GitHub: ${e.detail})`:"";
  if(e.status===401) return "التوكن غير صالح أو منتهي الصلاحية.";
  if(e.status===403 && /الملفات/.test(what)) return `لا يملك التوكن صلاحية ${what}. تحتاج Contents: Read and write (أو repo في توكن Classic).${d}`;
  if(e.status===403) return `لا يملك التوكن صلاحية ${what}. استخدم توكن Classic بصلاحيتي repo و delete_repo، أو Fine-grained بصلاحية Administration: Read and write على هذا المستودع.${d}`;
  if(e.status===404) return `لم يتم العثور على المستودع، أو لا يملك التوكن وصولاً إليه.${d}`;
  if(e.status===422) return `الاسم مستخدم مسبقاً أو غير صالح.${d}`;
  return e.message+d;
}

/* ---------- LOGIN (حسابات محفوظة) ---------- */
const ACC_KEY="ghfm_accounts";
function accList(){
  try{ const a=JSON.parse(localStorage.getItem(ACC_KEY)||"[]"); return Array.isArray(a)?a.filter(x=>x&&x.token&&x.id):[]; }
  catch{ return []; }
}
function accSave(list){
  try{ localStorage.setItem(ACC_KEY,JSON.stringify(list)); return true; }
  catch{ toast("تعذّر حفظ الحساب على الجهاز (التخزين ممتلئ أو معطّل).","error"); return false; }
}
function accFind(tok,login){
  const l=(login||"").toLowerCase();
  return accList().find(x=>x.token===tok||(l&&(x.login||"").toLowerCase()===l));
}
function accUpsert(tok,login,name){
  const list=accList();
  let a=list.find(x=>x.token===tok)||list.find(x=>(x.login||"").toLowerCase()===login.toLowerCase());
  if(a){ a.token=tok; a.login=login; if(name) a.name=name; }
  else{ a={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),name:name||login,login,token:tok,added:Date.now()}; list.push(a); }
  accSave(list); return a;
}
function accAvatar(a){
  const ini=esc((a.name||a.login||"?").trim().charAt(0).toUpperCase());
  return `<div class="acc-av"><span>${ini}</span><img src="https://github.com/${encodeURIComponent(a.login||"")}.png?size=80" alt="" loading="lazy" onerror="this.remove()" /></div>`;
}

/* تحقق من التوكن ثم ادخل. التوكن الجديد يُطلب له اسم ويُحفظ على الجهاز */
async function loginWith(tok,setBusy){
  setBusy(true); state.token=tok;
  try{
    const u=await gh("/user");
    state.username=u.login; localStorage.setItem("ghfm_token",tok); state.loginError="";
    const known=accFind(tok,u.login);
    if(known){
      const changed=known.token!==tok;
      accUpsert(tok,u.login);
      if(changed) toast(`تم تحديث توكن الحساب «${known.name}»`,"success");
      state.view="repos"; render(); return;
    }
    askAccountName(u.login,tok);
  }catch(err){
    state.token="";
    state.loginError=err.status===401?"التوكن غير صحيح أو منتهي الصلاحية. إن كان حساباً محفوظاً فاحذفه وأضفه بتوكن جديد.":err.message;
    render();
  }
}
function askAccountName(login,tok){
  const o=openSheet(`<h3>أضف اسماً لهذا الحساب</h3>
    <div class="dest">@${esc(login)}</div>
    <p class="note">التوكن صحيح ✓ اختر اسماً يسهّل عليك تمييز الحساب، وسيُحفظ على هذا الجهاز لتدخل لاحقاً بضغطة واحدة.</p>
    <div class="field"><label>اسم الحساب</label><input id="an" type="text" maxlength="30" value="${esc(login)}" autocomplete="off" /></div>
    <div class="row"><button class="btn btn-ghost" id="sk">تخطي</button><button class="btn btn-primary" id="ok">${icon("check",16)} حفظ ودخول</button></div>`);
  const inp=o.querySelector("#an"), ok=o.querySelector("#ok");
  const enter=()=>{ o.remove(); state.view="repos"; render(); };
  setTimeout(()=>{ inp.focus(); inp.select(); },60);
  o.querySelector("#sk").addEventListener("click",enter);
  const save=()=>{
    const name=inp.value.trim()||login;
    if(accUpsert(tok,login,name)) toast(`تم حفظ الحساب «${name}»`,"success");
    enter();
  };
  ok.addEventListener("click",save);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") save(); });
}
function showRenameAccount(a){
  const o=openSheet(`<h3>تعديل اسم الحساب</h3>
    <div class="dest">@${esc(a.login||"")}</div>
    <div class="field"><label>الاسم</label><input id="an" type="text" maxlength="30" value="${esc(a.name)}" autocomplete="off" /></div>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("check",16)} حفظ</button></div>`);

  const inp=o.querySelector("#an"); setTimeout(()=>{ inp.focus(); inp.select(); },60);
  const save=()=>{
    const name=inp.value.trim(); if(!name) return;
    const list=accList(), x=list.find(y=>y.id===a.id);
    if(x){ x.name=name; accSave(list); }

  };
  o.querySelector("#ok").addEventListener("click",save);
  inp.addEventListener("keydown",e=>{ if(e.key==="Enter") save(); });
}
async function showDeleteAccount(a){
  const go=await confirmSheet("حذف الحساب المحفوظ",`سيُحذف «${a.name}» وتوكنه من هذا الجهاز فقط. التوكن نفسه يبقى صالحاً على GitHub، ويمكنك إضافته مجدداً في أي وقت.`,"حذف","danger");

  accSave(accList().filter(x=>x.id!==a.id));

const REPO_NAME_RE=/^[A-Za-z0-9._-]+$/;
function showRenameRepo(r){
  const o=openSheet(`<h3>تعديل اسم المستودع</h3>
    <div class="field"><label>الاسم الجديد</label><input id="nn" type="text" dir="ltr" style="text-align:left" value="${esc(r.name)}" autocomplete="off" /></div>
    <div id="err" class="inlineerr"></div>
    <p class="note" style="margin-top:12px">سيتغير رابط المستودع. GitHub يحوّل الروابط القديمة تلقائياً إلى الجديدة.</p>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("check",16)} حفظ الاسم</button></div>`);
  const inp=o.querySelector("#nn"), err=o.querySelector("#err"), ok=o.querySelector("#ok");
  setTimeout(()=>{ inp.focus(); inp.select(); },60);
  o.querySelector("#c").addEventListener("click",()=>o.remove());
  o.addEventListener("click",e=>{ if(e.target===o) o.remove(); });
  ok.addEventListener("click",async()=>{
    const nn=inp.value.trim();
    const fail=m=>{ err.style.display="block"; err.textContent=m; };
    if(!nn) return fail("الاسم لا يمكن أن يكون فارغاً.");
    if(!REPO_NAME_RE.test(nn)) return fail("استخدم أحرفاً إنجليزية وأرقاماً و - _ . فقط، بدون مسافات.");
    if(nn===r.name) return o.remove();
    if(state.repos.some(x=>x.owner===r.owner&&x.name.toLowerCase()===nn.toLowerCase()&&x.id!==r.id)) return fail("يوجد مستودع بهذا الاسم مسبقاً.");
    busy(ok,"جارٍ التنفيذ...");
    try{
      let upd;
      try{ upd=await gh(`/repos/${r.owner}/${r.name}`,{method:"PATCH",body:JSON.stringify({name:nn})}); }
      catch(e){
        if(e.status!==404) throw e;
        const p=await probeRepo(r);
        if(p.st==="gone"){ dropRepoLocal(r); o.remove(); toast("هذا المستودع لم يعد موجوداً (محذوف مسبقاً). تم تحديث القائمة.","info"); render(); return; }
        if(p.st==="renamed"){ applyRename(r,p.data); o.remove(); toast("اسم المستودع كان قد تغيّر. تم تحديث القائمة، أعد المحاولة.","info"); render(); return; }
        throw e;
      }
      applyRename(r,upd);
      o.remove(); toast("تم تغيير اسم المستودع","success"); render();
    }catch(e){ o.remove(); toast(adminError(e,"تعديل المستودعات"),"error"); }
  });
}
function showDeleteRepo(r){
  const o=openSheet(`<h3>حذف المستودع</h3>
    <div class="error-msg" style="margin-bottom:12px">${icon("warn",16)}<span>سيُحذف المستودع مع كل ملفاته وسجلّه نهائياً، ولا يمكن التراجع.</span></div>
    <p class="note">للتأكيد اكتب اسم المستودع: <code class="mono" style="color:var(--danger)">${esc(r.name)}</code></p>
    <input id="cf" type="text" dir="ltr" style="text-align:left" autocomplete="off" autocapitalize="off" />
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-danger" id="ok" disabled>${icon("trash",16)} حذف نهائياً</button></div>`);
  const cf=o.querySelector("#cf"), ok=o.querySelector("#ok");
  cf.addEventListener("input",()=>{ ok.disabled=cf.value.trim()!==r.name; });
  o.querySelector("#c").addEventListener("click",()=>o.remove());
  o.addEventListener("click",e=>{ if(e.target===o) o.remove(); });
  ok.addEventListener("click",async()=>{
    busy(ok,"جارٍ الحذف...");
    try{
      let target=r;
      try{ await gh(`/repos/${target.owner}/${target.name}`,{method:"DELETE"}); }
      catch(e){
        if(e.status!==404) throw e;
        /* 404 لا تعني نقص الصلاحية: نتحقق من الحالة الفعلية للمستودع */
        const p=await probeRepo(target);
        if(p.st==="gone"){ dropRepoLocal(r); o.remove(); toast("المستودع محذوف مسبقاً. تم تحديث القائمة.","success"); render(); return; }
        if(p.st==="renamed"){
          applyRename(r,p.data); target={...r,owner:p.data.owner.login,name:p.data.name};
          await gh(`/repos/${target.owner}/${target.name}`,{method:"DELETE"});
        } else throw e;
      }
      dropRepoLocal(r);
      o.remove(); toast("تم حذف المستودع","success"); render();
    }catch(e){ o.remove(); toast(adminError(e,"حذف المستودعات"),"error"); }
  });
}

  const nameInp=o.querySelector("#rn"); setTimeout(()=>nameInp.focus(),60);

  ok.addEventListener("click",async()=>{

    if(!name) return fail("اكتب اسم المستودع.");

    if(state.repos.some(x=>x.owner===state.username&&x.name.toLowerCase()===name.toLowerCase())) return fail("يوجد مستودع بهذا الاسم مسبقاً.");
    err.style.display="none"; cancel.disabled=true;

    let created=null;
    try{

      created=raw;
      state.deletedIds.delete(raw.id); state.repos.unshift(mapRepo(raw));
      if(files.length){
        const ctx={owner:raw.owner.login,name:raw.name,branch:raw.default_branch};
        busy(ok,`رفع 1/${files.length}...`);
        await gh(`/repos/${ctx.owner}/${ctx.name}/contents/${encPath(files[0].name)}`,{method:"PUT",body:JSON.stringify({message:`رفع ${files[0].name}`,content:await fileToBase64(files[0])})});
        if(files.length>1){
          const entries=[];
          for(let i=1;i<files.length;i++){
            busy(ok,`رفع ${i+1}/${files.length}...`);
            const b=await withRetry(async()=>createBlob(ctx,await fileToBase64(files[i])));

      else toast(adminError(e,"إنشاء المستودعات"),"error");
    }
  });
}

function openRepo(r){
  loadCM();
  state.repo={owner:r.owner,name:r.name,fullName:r.fullName};
  state.branch=r.defaultBranch; state.branches=[r.defaultBranch]; state.tree=[]; state.cwd="";
  state.view="browser"; render();
  gh(`/repos/${r.owner}/${r.name}/branches?per_page=100`).then(d=>{ if(d.length){ state.branches=d.map(b=>b.name); if(state.view==="browser") render(); } }).catch(()=>{});
  loadTree();
}
async function loadTree(treeSha){
  const req=++state.treeReq, repoKey=state.repo.fullName+"|"+state.branch;
  state.treeLoading=true; if(state.view==="browser") render();
  try{
    const t=await apiTree(state.repo.owner,state.repo.name,state.branch,typeof treeSha==="string"?treeSha:undefined);
    if(req!==state.treeReq || !state.repo || repoKey!==state.repo.fullName+"|"+state.branch) return;
    state.tree=(t.tree||[]).filter(x=>x.type==="blob").map(x=>({path:x.path,sha:x.sha,size:x.size||0,mode:x.mode||"100644"}));
    if(t.truncated) toast("المستودع كبير جداً، قد لا تظهر بعض الملفات.","error");
  }catch(err){
    if(req!==state.treeReq) return;
    toast(err.message,"error"); state.tree=[];
  }
  finally{ if(req===state.treeReq){ state.treeLoading=false; if(state.view==="browser") render(); } }
}
function listDir(){
  const prefix=state.cwd?state.cwd+"/":"";
  const folders=new Map(), files=[];
  for(const f of state.tree){
    if(!f.path.startsWith(prefix)) continue;
    const rest=f.path.slice(prefix.length);
    const i=rest.indexOf("/");
    if(i===-1) files.push({...f,name:rest});
    else { const n=rest.slice(0,i); folders.set(n,(folders.get(n)||0)+1); }
  }
  files.sort((a,b)=>a.name.localeCompare(b.name));
  return {folders:[...folders.entries()].sort((a,b)=>a[0].localeCompare(b[0])), files};
}
const rowEls=new Map();
const queue=[]; let running=0; const queued=new Set();
function enqueue(item){ item._ctx=item._ctx||curCtx(); const k=item._ctx.owner+"/"+item._ctx.name+"|"+item._ctx.branch+"|"+item.path+"|"+item.sha; item._qk=k; if(queued.has(k)) return; queued.add(k); queue.push(item); pump(); }
function pump(){
  while(running<3 && queue.length){
    const it=queue.shift(); running++;
    loadDetails(it).finally(()=>{ running--; pump(); });
  }
}
function dateKey(path,sha){ return `${state.repo.owner}/${state.repo.name}|${state.branch}|${path}|${sha}`; }
function paintRow(item){
  const row=rowEls.get(item.path); if(!row) return;
  const kind=kindOf(item.name);
  const lEl=row.querySelector("[data-lines]"), dEl=row.querySelector("[data-date]");
  if(!kind.text || item.size>LINE_LIMIT){ lEl.textContent = kind.text?"غير محسوب (ملف كبير)":"—"; lEl.classList.remove("load"); }
  else { const n=cache.lines[item.sha]; if(n!==undefined){ lEl.textContent=n.toLocaleString("en-US")+" سطر"; lEl.classList.remove("load"); } }
  const d=cache.dates[dateKey(item.path,item.sha)];
  if(d){ dEl.textContent=fmtDate(d); dEl.classList.remove("load"); }
}
async function loadDetails(item){
  const kind=kindOf(item.name);
  const jobs=[];
  if(kind.text && item.size<=LINE_LIMIT && cache.lines[item.sha]===undefined){
    jobs.push(countLines(item.sha,item._ctx).then(n=>{ cache.lines[item.sha]=n; }).catch(()=>{ queued.delete(item._qk); const r=rowEls.get(item.path); if(r) r.querySelector("[data-lines]").textContent="—"; }));
  }
  const dk=dateKey(item.path,item.sha);
  if(!cache.dates[dk]){
    jobs.push(lastCommitDate(item.path,item._ctx).then(d=>{ if(d) cache.dates[dk]=d; }).catch(()=>{ queued.delete(item._qk); const r=rowEls.get(item.path); if(r) r.querySelector("[data-date]").textContent="—"; }));
  }
  await Promise.all(jobs);
  saveCache(); paintRow(item);
}

    </div>`);
    c._item=f; rowEls.set(f.path,c);
    const pb=c.querySelector('[data-act="preview"]'); if(pb) pb.addEventListener("click",()=>showPreview(f));

  });

  return wrap;
}


/* أخطاء تعني أن حالة الملفات لدينا قديمة (تم تغييرها أو حذفها من مكان آخر) */
async function staleFileError(e){

/* ---------- FILE RENAME ---------- */
function showRename(f){
  const o=openSheet(`<h3>تعديل اسم الملف</h3>
    <div class="field"><label>الاسم الجديد</label><input id="nn" type="text" dir="ltr" style="text-align:left" value="${esc(f.name)}" autocomplete="off" /></div>
    <div id="err" class="inlineerr"></div>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("check",16)} حفظ الاسم</button></div>`);
  const inp=o.querySelector("#nn"), err=o.querySelector("#err"), ok=o.querySelector("#ok");
  setTimeout(()=>{ inp.focus(); const i=f.name.lastIndexOf("."); inp.setSelectionRange(0,i>0?i:f.name.length); },60);
  o.querySelector("#c").addEventListener("click",()=>o.remove());
  o.addEventListener("click",e=>{ if(e.target===o) o.remove(); });
  ok.addEventListener("click",async()=>{
    const nn=inp.value.trim();
    const fail=m=>{ err.style.display="block"; err.textContent=m; };
    if(!nn) return fail("الاسم لا يمكن أن يكون فارغاً.");
    if(nn.includes("/")) return fail("الاسم لا يمكن أن يحتوي على /");
    if(nn===f.name) return o.remove();
    const newPath=state.cwd?state.cwd+"/"+nn:nn;
    if(state.tree.some(t=>t.path===newPath)) return fail("يوجد ملف بهذا الاسم مسبقاً.");
    busy(ok,"جارٍ التنفيذ...");
    try{
      const cm=await commitEntries([
        {path:newPath,mode:f.mode,type:"blob",sha:f.sha},
        {path:f.path,mode:f.mode,type:"blob",sha:null},
      ],`تغيير اسم ${f.path} إلى ${newPath}`);
      const od=cache.dates[dateKey(f.path,f.sha)];
      if(od) cache.dates[dateKey(newPath,f.sha)]=od;
      saveCache(); o.remove(); toast("تم تغيير الاسم","success"); await loadTree(cm.tree.sha);
    }catch(e){ o.remove(); if(!(await staleFileError(e))) toast(adminError(e,"تعديل الملفات"),"error"); }
  });
}

/* ---------- FILE DELETE ---------- */
function showDelete(f){
  const o=openSheet(`<h3>تأكيد الحذف</h3>
    <p class="note">سيتم حذف <code class="mono" style="color:var(--danger)">${esc(f.path)}</code> من الفرع <code class="mono">${esc(state.branch)}</code>. لا يمكن التراجع عن هذا الإجراء من التطبيق.</p>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-danger" id="ok">${icon("trash",16)} حذف نهائياً</button></div>`);
  o.querySelector("#c").addEventListener("click",()=>o.remove());
  o.addEventListener("click",e=>{ if(e.target===o) o.remove(); });
  o.querySelector("#ok").addEventListener("click",async()=>{
    busy(o.querySelector("#ok"),"جارٍ الحذف...");
    try{
      const del=await gh(`/repos/${state.repo.owner}/${state.repo.name}/contents/${encPath(f.path)}`,{method:"DELETE",body:JSON.stringify({message:`حذف ${f.path}`,sha:f.sha,branch:state.branch})});
      o.remove(); toast("تم حذف الملف","success");
      state.tree=state.tree.filter(t=>t.path!==f.path); render();
      await loadTree(del.commit.tree.sha);
    }catch(e){ o.remove(); if(!(await staleFileError(e))) toast(adminError(e,"حذف الملفات"),"error"); }
  });
}

/* ---------- FILE UPLOAD ---------- */
document.getElementById("filePicker").addEventListener("change",e=>{
  const files=[...e.target.files]; if(files.length && state.view==="browser") showUpload(files);
});
function showUpload(files){
  let items=files.map(f=>({file:f,name:f.name,desc:"",rel:(f.size>4*1024*1024||/\.apk$/i.test(f.name)),url:""}));
  const readmeOld=()=>state.tree.find(t=>t.type==="blob"&&t.path.toLowerCase()===pathOf("README.md").toLowerCase());
  const o=openSheet(`<h3>رفع ملفات</h3>
    <div class="dest">${esc(state.repo.name)}/${esc(state.cwd)}${state.cwd?"/":""}  ·  ${esc(state.branch)}</div>
    <div id="items"></div>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("upload",16)} رفع</button></div>`);
  const box=o.querySelector("#items"), ok=o.querySelector("#ok");
  const pathOf=n=>state.cwd?state.cwd+"/"+n:n;
  function validate(){
    const seen=new Set(); let good=items.length>0;
    box.querySelectorAll(".upitem").forEach((row,i)=>{
      const it=items[i], name=it.name.trim(), p=pathOf(name);
      let msg="", warn=false;
      if(!name) msg="الاسم فارغ.";
      else if(name.includes("/")) msg="الاسم لا يمكن أن يحتوي على /";
      else if(seen.has(p)) msg="اسم مكرر ضمن الملفات المختارة.";
      else if(it.rel&&it.file.size>REL_MAX_ASSET) msg="الملف أكبر من 2GB.";
      else if(!it.rel&&it.file.size>MAX_UPLOAD) msg="الملف أكبر من 50MB (فعّل «رفع كمرفق Release» للملفات الأكبر).";
      else if(!it.rel&&state.tree.some(t=>t.path===p)) warn=true;
      if(!msg && name.toLowerCase()==="readme.md" && items.some(x=>x.desc.trim())) msg="لا يمكن رفع README.md مع وصف في نفس الدفعة.";
      seen.add(p);
      row.querySelector(".errline").textContent=msg;
      row.querySelector(".warnline").style.display=warn?"flex":"none";
      const dn=row.querySelector(".dnote"); if(dn) dn.textContent=it.desc.trim()?"→ README.md":"";
      if(msg) good=false;
    });
    ok.disabled=!good;
  }
  function draw(){
    box.innerHTML=items.map((it,i)=>`<div class="upitem">
      <div class="top"><input type="text" data-i="${i}" value="${esc(it.name)}" />
        <button class="iconbtn danger" data-rm="${i}">${icon("close",16)}</button></div>
      <div class="sz">${fmtSize(it.file.size)}</div>
      <label class="rellabel"><input type="checkbox" data-rl="${i}" ${it.rel?"checked":""} /> <span>رفع كمرفق Release (موصى به للـ APK والملفات الكبيرة، أسرع وأقل استهلاكاً للذاكرة)</span></label>
      <textarea data-d="${i}" placeholder="وصف الملف (اختياري) — يظهر لزوار المستودع في README مع زر تنزيل">${esc(it.desc)}</textarea>
      <div class="dnote" data-dn="${i}"></div>
      <div class="warnline" style="display:none">${icon("warn",14)} يوجد ملف بنفس الاسم، سيتم استبداله.</div>
      <div class="errline"></div></div>`).join("");
    box.querySelectorAll("input[data-i]").forEach(inp=>inp.addEventListener("input",()=>{ items[+inp.dataset.i].name=inp.value; validate(); }));
    box.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ items.splice(+b.dataset.rm,1); if(!items.length) return o.remove(); draw(); }));
    box.querySelectorAll("input[data-rl]").forEach(c=>c.addEventListener("change",()=>{ items[+c.dataset.rl].rel=c.checked; validate(); }));
    box.querySelectorAll("textarea[data-d]").forEach(ta=>ta.addEventListener("input",()=>{ items[+ta.dataset.d].desc=ta.value; validate(); }));
    validate();
  }
  draw();
  o.querySelector("#c").addEventListener("click",()=>o.remove());
  ok.addEventListener("click",async()=>{
    ok.disabled=true; o.querySelector("#c").disabled=true;
    try{
      const entries=[];
      const relItems=items.filter(x=>x.rel);
      if(relItems.length){
        busy(ok,"تجهيز إصدار الملفات...");
        const rel=await relEnsureFilesRelease(state.branch);
        let k=0;
        for(const it of relItems){
          k++; const nm=relSafeName(it.name.trim());
          let last=0;
          relUploading=true;
          try{
            const j=await relUploadAsset(rel,it.file,nm,{replace:true,onPct:p=>{ if(p-last>=2||p>=99){ last=p; busy(ok,`رفع ${k}/${relItems.length}... ${p}%`); } }});
            it.url=(j&&j.browser_download_url)||"";
          }catch(e){
            relUploading=false;
            if(e.status===undefined) e.message=relUpErr(e);
            throw e;
          }
          relUploading=false;
        }
      }
      const gitItems=items.filter(x=>!x.rel);
      for(let i=0;i<gitItems.length;i++){
        busy(ok,`رفع ${i+1}/${gitItems.length}...`);
        const blob=await createBlob(curCtx(),await fileToBase64(gitItems[i].file));
        entries.push({path:pathOf(gitItems[i].name.trim()),mode:"100644",type:"blob",sha:blob.sha});
      }
      const described=items.filter(x=>x.desc.trim());
      if(described.length){
        busy(ok,"تحديث README...");
        const old=readmeOld(); let txt="";
        if(old){ const b=await gh(`/repos/${state.repo.owner}/${state.repo.name}/git/blobs/${old.sha}`); const bin=atob(String(b.content).replace(/\s/g,"")); const u=new Uint8Array(bin.length); for(let k=0;k<bin.length;k++) u[k]=bin.charCodeAt(k); txt=new TextDecoder().decode(u); }
        for(const it of described){
          const n=it.name.trim(), a=`<!-- gitora:${n} -->`, z=`<!-- /gitora:${n} -->`;
          const block=`${a}\n## ${n}\n\n${it.desc.trim()}\n\n[⬇ تحميل ${n}](${it.rel&&it.url?it.url:encodeURIComponent(n)+"?raw=true"})\n${z}`;
          const i1=txt.indexOf(a), i2=txt.indexOf(z);
          if(i1>=0&&i2>i1) txt=txt.slice(0,i1)+block+txt.slice(i2+z.length);
          else txt=(txt.trim()?txt.replace(/\s+$/,"")+"\n\n---\n\n":"")+block+"\n";
        }
        const rb=await createBlob(curCtx(),bytesToB64(new TextEncoder().encode(txt)));
        entries.push({path:old?old.path:pathOf("README.md"),mode:"100644",type:"blob",sha:rb.sha});
      }
      if(!entries.length){ o.remove(); toast(items.length===1?"تم رفع الملف كمرفق Release":`تم رفع ${items.length} ملفات كمرافق Release`,"success"); if(state.rel) state.rel=null; return; }
      busy(ok,"إنهاء...");
      const cm=await commitEntries(entries, entries.length===1?`رفع ${entries[0].path}`:`رفع ${entries.length} ملفات`);
      o.remove(); toast(items.length===1?"تم رفع الملف":`تم رفع ${items.length} ملفات`,"success"); if(state.rel) state.rel=null; await loadTree(cm.tree.sha);
    }catch(e){ o.remove(); if(!(await staleFileError(e))) toast(adminError(e,"رفع الملفات"),"error"); }
  });
}

/* ========================= CODE EDITOR ========================= */
const MAX_EDIT = 2*1024*1024;
const CM_BASE = "https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/";
let cmPromise=null, ed=null, edUid=0;

function loadScriptUrl(u){ return new Promise(res=>{ const s=document.createElement("script"); s.src=u; s.onload=()=>res(true); s.onerror=()=>res(false); document.head.appendChild(s); }); }
function loadCssUrl(u){ const l=document.createElement("link"); l.rel="stylesheet"; l.href=u; document.head.appendChild(l); }
function loadCM(){
  if(cmPromise) return cmPromise;
  cmPromise=(async()=>{
    ["codemirror.min.css","addon/hint/show-hint.min.css","addon/fold/foldgutter.min.css"].forEach(p=>loadCssUrl(CM_BASE+p));
    if(!(await loadScriptUrl(CM_BASE+"codemirror.min.js"))) return false;
    const g1=["addon/mode/simple.min.js","mode/meta.min.js","mode/javascript/javascript.min.js","mode/xml/xml.min.js","mode/css/css.min.js","mode/clike/clike.min.js","mode/python/python.min.js","mode/shell/shell.min.js","mode/sql/sql.min.js","mode/yaml/yaml.min.js","mode/go/go.min.js","mode/ruby/ruby.min.js","mode/swift/swift.min.js","mode/lua/lua.min.js","mode/properties/properties.min.js",
      "addon/edit/closebrackets.min.js","addon/edit/matchbrackets.min.js","addon/selection/active-line.min.js","addon/fold/foldcode.min.js","addon/fold/brace-fold.min.js","addon/fold/xml-fold.min.js","addon/fold/indent-fold.min.js","addon/fold/comment-fold.min.js","addon/comment/comment.min.js","addon/search/match-highlighter.min.js","addon/hint/show-hint.min.js","addon/hint/anyword-hint.min.js"];
    await Promise.all(g1.map(p=>loadScriptUrl(CM_BASE+p)));
    const g2=["addon/fold/foldgutter.min.js","addon/edit/closetag.min.js","addon/edit/matchtags.min.js","mode/htmlmixed/htmlmixed.min.js","mode/markdown/markdown.min.js","mode/php/php.min.js","mode/rust/rust.min.js","mode/toml/toml.min.js"];
    await Promise.all(g2.map(p=>loadScriptUrl(CM_BASE+p)));
    return !!window.CodeMirror;
  })();
  cmPromise.then(ok=>{ if(!ok) cmPromise=null; });
  return cmPromise;
}

const CM_MODES={ js:"javascript", mjs:"javascript", cjs:"javascript", jsx:"text/jsx", ts:"text/typescript", tsx:"text/typescript-jsx", json:"application/json",
  html:"htmlmixed", htm:"htmlmixed", vue:"htmlmixed", xml:"xml", svg:"xml", css:"css", scss:"text/x-scss", py:"python", pyw:"python", md:"markdown",
  java:"text/x-java", kt:"text/x-kotlin", c:"text/x-csrc", h:"text/x-csrc", cpp:"text/x-c++src", cs:"text/x-csharp", go:"go", rs:"rust",
  php:"application/x-httpd-php", rb:"ruby", swift:"swift", sh:"shell", sql:"text/x-sql", lua:"lua", dart:"application/dart",
  yml:"yaml", yaml:"yaml", toml:"toml", ini:"text/x-properties", cfg:"text/x-properties", env:"text/x-properties" };
function cmModeFor(name){
  const low=name.toLowerCase();
  if(low==="dockerfile"||low==="makefile") return "shell";
  if(low===".env"||low.startsWith(".env.")) return "text/x-properties";
  return CM_MODES[extOf(name)]||null;
}
function canEditFile(f){ const k=kindOf(f.name); return (k.text||extOf(f.name)==="svg") && f.size<=MAX_EDIT; }

function loadEdPrefs(){ try{ return Object.assign({wrap:false,fs:13},JSON.parse(localStorage.getItem("ghfm_ed")||"{}")); }catch{ return {wrap:false,fs:13}; } }
function saveEdPrefs(p){ try{ localStorage.setItem("ghfm_ed",JSON.stringify(p)); }catch{} }

async function fetchBlobBytes(sha){
  const {owner,name}=state.repo;
  const res=await fetch(`${API}/repos/${owner}/${name}/git/blobs/${sha}`,{cache:"no-store",headers:headers({"Accept":"application/vnd.github.raw+json"})});
  if(!res.ok){ if(res.status===401) logout(true); const e=new Error(mapStatus(res.status)); e.status=res.status; throw e; }
  return new Uint8Array(await res.arrayBuffer());
}
function decodeText(u8){
  const n=Math.min(u8.length,8000);
  for(let i=0;i<n;i++) if(u8[i]===0) return null;
  try{ return new TextDecoder("utf-8",{fatal:true,ignoreBOM:true}).decode(u8); }catch{ return null; }
}
function bytesToB64(u8){ let s=""; const CH=0x8000; for(let i=0;i<u8.length;i+=CH) s+=String.fromCharCode.apply(null,u8.subarray(i,i+CH)); return btoa(s); }
function detectIndent(text){
  const lines=text.split("\n",400); let tabs=0, min=0;
  for(const l of lines){
    if(l[0]==="\t") tabs++;
    else { const m=/^( +)\S/.exec(l); if(m){ const n=m[1].length; if(!min||n<min) min=n; } }
  }
  if(tabs>0 && tabs>=lines.filter(l=>/^ +\S/.test(l)).length) return {tabs:true,size:4};
  return {tabs:false,size:[2,4,8].includes(min)?min:(min>8?8:min>4?4:min>2?4:2)};
}
function confirmSheet(title,msg,okLabel,kind){
  return new Promise(res=>{
    const o=openSheet(`<h3>${esc(title)}</h3><p class="note">${esc(msg)}</p>
      <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn ${kind==="danger"?"btn-danger":"btn-primary"}" id="ok">${esc(okLabel)}</button></div>`);
    const done=v=>{ o.remove(); res(v); };
    o.querySelector("#c").addEventListener("click",()=>done(false));
    o.querySelector("#ok").addEventListener("click",()=>done(true));
    o.addEventListener("click",ev=>{ if(ev.target===o) done(false); });
  });
}

/* ---- editor state helpers ---- */
function edVal(){ return ed.cm?ed.cm.getValue():(ed.ta?ed.ta.value:""); }
function edDirty(){ if(!ed||!ed.loaded) return false; return ed.cm?!ed.cm.isClean(ed.gen):(ed.ta?ed.ta.value!==ed.text0:false); }
function edMarkClean(gen,snapshot){ if(ed.cm) ed.gen=gen; else ed.text0=snapshot; }
function syncDirty(){
  const d=edDirty();
  const dot=document.getElementById("edDot"), sv=document.getElementById("edSave");
  if(dot) dot.classList.toggle("on",d);
  if(sv) sv.disabled=!d;
}
function edFit(){
  const s=document.querySelector(".edscreen"); if(!s) return;
  const vv=window.visualViewport;
  if(vv && window.innerWidth<520) s.style.height=vv.height+"px";
  window.scrollTo(0,0);
}
window.addEventListener("beforeunload",ev=>{ if(ed && state.view==="editor" && edDirty()){ ev.preventDefault(); ev.returnValue=""; } });

function openEditor(f){
  if(!canEditFile(f)) return toast("لا يمكن تعديل هذا النوع من الملفات.","error");
  const prefs=loadEdPrefs();
  const e=ed={ id:++edUid, path:f.path, sha:f.sha, mode:f.mode||"100644", size:f.size, loaded:false, cm:null, ta:null, cmOk:false, crlf:false, bom:false, gen:0, text0:"", saved:false, treeSha:undefined, prefs,
    find:{open:false,rep:false,c:false,rx:false,w:false,q:"",r:"",matches:[],cur:-1,marks:[],t:null}, indent:{tabs:false,size:2} };
  state.view="editor"; render();
  if(window.visualViewport){ e.vvFn=edFit; window.visualViewport.addEventListener("resize",e.vvFn); edFit(); }
  loadEditorContent(e);
}
function editorFail(msg){
  const box=document.getElementById("edLoad"); if(!box) return;
  box.innerHTML=`${icon("warn",34)}<div>${esc(msg)}</div><button class="btn btn-ghost btn-sm" id="edBack2">رجوع</button>`;
  box.querySelector("#edBack2").addEventListener("click",()=>leaveEditor(true));
}
async function loadEditorContent(e){
  const cmP=loadCM();
  let u8;
  try{ u8=await fetchBlobBytes(e.sha); }
  catch(err){ if(ed!==e) return; return editorFail(err.status===404?"تعذّر العثور على الملف (قد يكون تغيّر). ارجع وحدّث القائمة.":err.message); }
  const ok=await cmP;
  if(ed!==e || state.view!=="editor") return;
  const raw=decodeText(u8);
  if(raw===null) return editorFail("هذا الملف ليس نصاً بترميز UTF-8، لا يمكن تعديله هنا.");
  e.bom = raw.charCodeAt(0)===0xFEFF;
  let text = e.bom?raw.slice(1):raw;
  const crlfN=(text.match(/\r\n/g)||[]).length, lfN=(text.match(/\n/g)||[]).length-crlfN, crN=(text.match(/\r(?!\n)/g)||[]).length;
  e.crlf = crlfN>0 && lfN===0 && crN===0;
  if(!e.crlf && (crlfN>0||crN>0)) toast("الملف يحتوي نهايات أسطر مختلطة، ستُوحَّد إلى LF عند الحفظ.","info");
  text=text.replace(/\r\n?/g,"\n");
  e.indent=detectIndent(text);
  e.text0=text; e.cmOk=!!ok; e.loaded=true;
  const wrap=shell.querySelector(".edscreen"); if(wrap) mountEditor(wrap,text);
}
function leaveEditor(force){
  const e=ed; if(!e) return;
  if(!force && edDirty()){
    confirmSheet("تعديلات غير محفوظة","لديك تعديلات لم تُحفظ في هذا الملف. هل تريد تجاهلها والخروج؟","تجاهل وخروج","danger").then(ok=>{ if(ok) leaveEditor(true); });
    return;
  }
  clearTimeout(e.find.t);
  if(e.vvFn && window.visualViewport) window.visualViewport.removeEventListener("resize",e.vvFn);
  ed=null; state.view="browser"; render();
}

/* ---- find & replace ---- */
function fbuildRe(F){
  if(!F.q) return null;
  let s=F.rx?F.q:F.q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  if(F.w) s=`\\b(?:${s})\\b`;
  try{ return new RegExp(s,F.c?"g":"gi"); }catch{ return null; }
}
function fPaint(){
  const F=ed.find, c=document.getElementById("fcount"); if(!c) return;
  if(F.q && F.rx && !fbuildRe(F)) c.textContent="خطأ";
  else c.textContent=F.matches.length?`${F.cur+1}/${F.matches.length}`:(F.q?"0":"");
}
function fClear(){ const F=ed.find; F.marks.forEach(m=>m.clear()); F.marks=[]; }
function fRun(){
  const e=ed; if(!e||!e.cm) return;
  const F=e.find, cm=e.cm;
  fClear(); F.matches=[]; F.cur=-1;
  const rx=fbuildRe(F);
  if(!rx){ fPaint(); return; }
  const text=cm.getValue(); let m;
  while((m=rx.exec(text))){
    if(m[0].length===0){ rx.lastIndex++; continue; }
    F.matches.push([m.index,m.index+m[0].length]);
    if(F.matches.length>20000) break;
  }
  if(F.matches.length<=800) F.matches.forEach(([a,b])=>F.marks.push(cm.markText(cm.posFromIndex(a),cm.posFromIndex(b),{className:"cm-find-hit"})));
  if(F.matches.length){
    const ci=cm.indexFromPos(cm.getCursor("from"));
    let k=F.matches.findIndex(x=>x[0]>=ci); if(k<0) k=0; F.cur=k;
  }
  fPaint();
}
function fGoto(k){
  const F=ed.find, cm=ed.cm; if(!cm||!F.matches.length) return;
  F.cur=k; const [a,b]=F.matches[k];
  const from=cm.posFromIndex(a), to=cm.posFromIndex(b);
  cm.setSelection(from,to); cm.scrollIntoView({from,to},90); fPaint();
}
function fStep(d){ const F=ed.find; if(!F.matches.length) return; fGoto((F.cur+d+F.matches.length)%F.matches.length); }
function fReplText(F,matchText){
  if(!F.rx) return F.r;
  const rx=fbuildRe(F); if(!rx) return F.r;
  return matchText.replace(new RegExp(rx.source,rx.flags.replace("g","")),F.r);
}
function fReplaceOne(){
  const F=ed.find, cm=ed.cm; if(!cm) return;
  fRun(); if(!F.matches.length) return;
  const [a,b]=F.matches[F.cur<0?0:F.cur];
  const from=cm.posFromIndex(a), to=cm.posFromIndex(b);
  const nt=fReplText(F,cm.getRange(from,to));
  cm.replaceRange(nt,from,to);
  cm.setCursor(cm.posFromIndex(a+nt.length));
  fRun(); if(F.matches.length) fGoto(F.cur);
}
function fReplaceAll(){
  const F=ed.find, cm=ed.cm; if(!cm) return;
  fRun(); const n=F.matches.length; if(!n) return;
  const list=F.matches.slice();
  fClear();
  cm.operation(()=>{
    for(let i=list.length-1;i>=0;i--){
      const from=cm.posFromIndex(list[i][0]), to=cm.posFromIndex(list[i][1]);
      cm.replaceRange(fReplText(F,cm.getRange(from,to)),from,to);
    }
  });
  fRun(); toast(`تم استبدال ${n} نتيجة`,"success");
}
function openFind(withReplace){
  const e=ed; if(!e||!e.loaded) return;
  const F=e.find, fb=document.getElementById("findbar"), fq=document.getElementById("fq"); if(!fb) return;
  if(!e.cm) return toast("البحث يحتاج المحرر المتقدّم.","info");
  F.open=true; fb.classList.add("open"); if(withReplace){ F.rep=true; }
  fb.classList.toggle("rep",F.rep);
  const sel=e.cm.getSelection();
  if(sel && !sel.includes("\n") && sel.length<200){ fq.value=F.q=sel; }
  fq.focus(); fq.select(); fRun();
  edFit();
}
function closeFind(){
  const e=ed; if(!e) return; const F=e.find;
  F.open=false; const fb=document.getElementById("findbar"); if(fb) fb.classList.remove("open");
  if(e.cm){ fClear(); F.matches=[]; e.cm.focus(); }
}

function showGoto(){
  const e=ed; if(!e||!e.cm) return;
  const total=e.cm.lineCount();
  const o=openSheet(`<h3>الانتقال إلى سطر</h3>
    <div class="field"><label>رقم السطر (1 - ${total})</label><input id="ln" type="text" inputmode="numeric" dir="ltr" style="text-align:left" autocomplete="off" /></div>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("check",16)} انتقال</button></div>`);
  const inp=o.querySelector("#ln"); setTimeout(()=>inp.focus(),60);
  const go=()=>{
    const n=Math.min(total,Math.max(1,parseInt(inp.value,10)||1));
    o.remove();
    const pos={line:n-1,ch:0}; e.cm.setCursor(pos);
    e.cm.scrollIntoView(pos,Math.round(e.cm.getScrollInfo().clientHeight/2)); e.cm.focus();
  };
  o.querySelector("#c").addEventListener("click",()=>o.remove());
  o.querySelector("#ok").addEventListener("click",go);
  inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter") go(); });
  o.addEventListener("click",ev=>{ if(ev.target===o) o.remove(); });
}

/* ---- save ---- */
function showSave(){
  const e=ed; if(!e||!e.loaded||!edDirty()) return;
  const defMsg=`تعديل ${e.path}`;
  const o=openSheet(`<h3>حفظ التعديلات</h3>
    <div class="dest">${esc(state.repo.name)}/${esc(e.path)}  ·  ${esc(state.branch)}</div>
    ${diffBlock(e.text0,edVal())}
    <div class="field"><label>رسالة الحفظ (Commit)</label><input id="cmsg" type="text" value="${esc(defMsg)}" autocomplete="off" /></div>
    <div id="err" class="inlineerr"></div>
    <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("save",16)} حفظ في GitHub</button></div>`);
  const inp=o.querySelector("#cmsg"), err=o.querySelector("#err"), ok=o.querySelector("#ok"), cancel=o.querySelector("#c");
  const okHtml=ok.innerHTML;
  const reset=()=>{ ok.disabled=false; ok.innerHTML=okHtml; cancel.disabled=false; };
  cancel.addEventListener("click",()=>o.remove());
  o.addEventListener("click",ev=>{ if(ev.target===o && !ok.disabled) o.remove(); });
  inp.addEventListener("keydown",ev=>{ if(ev.key==="Enter"&&!ok.disabled) ok.click(); });
  ok.addEventListener("click",async()=>{
    const msg=inp.value.trim()||defMsg;
    err.style.display="none"; cancel.disabled=true; busy(ok,"جارٍ التحقق...");
    try{
      const ctx=curCtx();
      let remote=null;
      try{ remote=(await gh(`/repos/${ctx.owner}/${ctx.name}/contents/${encPath(e.path)}?ref=${encodeURIComponent(ctx.branch)}`)).sha; }
      catch(x){ if(x.status!==404) throw x; }
      if(remote!==e.sha){
        const go=await confirmSheet("الملف تغيّر على GitHub",
          remote===null?"لم يعد الملف موجوداً في هذا الفرع (حُذف أو نُقل). سيُعاد إنشاؤه بهذا المحتوى.":"تغيّر هذا الملف على GitHub بعد أن فتحته (من جهاز آخر أو commit جديد). المتابعة ستستبدل النسخة الموجودة بنسختك.",
          "متابعة وحفظ","danger");
        if(!go){ reset(); return; }
      }
      busy(ok,"جارٍ الحفظ...");
      const snapshot=edVal(), gen=e.cm?e.cm.changeGeneration(true):0;
      let v=snapshot; if(e.crlf) v=v.replace(/\n/g,"\r\n"); if(e.bom) v="\uFEFF"+v;
      const bytes=new TextEncoder().encode(v);
      const blob=await createBlob(ctx,bytesToB64(bytes));
      const cm=await withRetry(()=>commitEntries([{path:e.path,mode:e.mode,type:"blob",sha:blob.sha}],msg,ctx),3);
      e.sha=blob.sha; e.size=bytes.length; e.saved=true; e.text0=snapshot; edMarkClean(gen,snapshot);
      const t=state.tree.find(x=>x.path===e.path); if(t){ t.sha=blob.sha; t.size=bytes.length; }
      o.remove(); syncDirty(); toast("تم حفظ التعديلات في GitHub","success");
      loadTree(cm.tree.sha);
    }catch(x){
      err.style.display="block"; err.textContent=adminError(x,"تعديل الملفات")+" تعديلاتك ما زالت محفوظة في المحرر."; reset();
    }
  });
  setTimeout(()=>{ inp.focus(); inp.select(); },60);
}

/* ---- download ---- */
function triggerDownload(blob,name){
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; a.style.display="none";
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },4000);
}
async function downloadRepoFile(f,btn){
  const orig=btn.innerHTML; busy(btn,"جارٍ التنزيل...");
  try{
    const u8=await fetchBlobBytes(f.sha);
    triggerDownload(new Blob([u8],{type:"application/octet-stream"}), f.path.split("/").pop());
    toast("تم تنزيل الملف بمحتواه كاملاً","success");
  }catch(err){
    toast(err.status===404?"تعذّر العثور على الملف (قد يكون تغيّر). حدّث القائمة.":(err.message||"فشل التنزيل"),"error");
  }finally{ btn.disabled=false; btn.innerHTML=orig; }
}
function edDownload(){
  const e=ed; if(!e||!e.loaded) return;
  let v=edVal(); if(e.crlf) v=v.replace(/\n/g,"\r\n"); if(e.bom) v="\uFEFF"+v;
  triggerDownload(new Blob([v],{type:"application/octet-stream"}), e.path.split("/").pop());
  toast("تم تنزيل المحتوى الحالي للمحرر","success");
}

/* ---- paste / delete helpers ---- */
function edInsertText(t){
  const e=ed; if(!e||!t) return;
  if(e.cm){ e.cm.replaceSelection(t,"end"); e.cm.focus(); }
  else if(e.ta){ const ta=e.ta; ta.setRangeText(t,ta.selectionStart,ta.selectionEnd,"end"); ta.dispatchEvent(new Event("input")); ta.focus(); }
}
async function edPaste(){
  const e=ed; if(!e||!e.loaded) return;
  let t=null;
  try{ if(navigator.clipboard && navigator.clipboard.readText) t=await navigator.clipboard.readText(); }catch{}
  if(ed!==e) return;
  if(t===null || t===undefined){
    const o=openSheet(`<h3>لصق نص</h3><p class="note">المتصفح لم يسمح بقراءة الحافظة مباشرة. اضغط مطولاً داخل المربع واختر «لصق» ثم اضغط إدراج.</p>
      <div class="field"><textarea id="pt" dir="ltr" style="width:100%;min-height:140px;text-align:left;font-family:'JetBrains Mono',monospace;font-size:13px" spellcheck="false" autocapitalize="off"></textarea></div>
      <div class="row"><button class="btn btn-ghost" id="c">إلغاء</button><button class="btn btn-primary" id="ok">${icon("check",16)} إدراج</button></div>`);
    wireSheet(o);
    const ta=o.querySelector("#pt"); setTimeout(()=>ta.focus(),60);
    o.querySelector("#ok").addEventListener("click",()=>{ const v=ta.value; o.remove(); if(ed===e) edInsertText(v); });
    return;
  }
  if(t==="") return toast("الحافظة فارغة.","info");
  edInsertText(t.replace(/\r\n?/g,"\n"));
}
async function edDeleteAll(){
  const e=ed; if(!e||!e.loaded) return;
  if(!edVal()) return toast("المحرر فارغ بالفعل.","info");
  const ok=await confirmSheet("حذف كل المحتوى",
    e.cm?"سيُمسح كل النص في المحرر دفعة واحدة. لا يتغير شيء في GitHub إلا عند الحفظ، ويمكنك التراجع بزر التراجع.":"سيُمسح كل النص في المحرر دفعة واحدة. لا يتغير شيء في GitHub إلا عند الحفظ.",
    "حذف الكل","danger");
  if(!ok || ed!==e) return;
  if(e.cm){ const last=e.cm.lastLine(); e.cm.replaceRange("",{line:0,ch:0},{line:last,ch:e.cm.getLine(last).length}); e.cm.focus(); }
  else if(e.ta){ e.ta.value=""; e.ta.dispatchEvent(new Event("input")); e.ta.focus(); }
}
function edDeleteLine(){
  const e=ed; if(!e||!e.loaded) return;
  if(e.cm){ e.cm.execCommand("deleteLine"); e.cm.focus(); return; }
  const ta=e.ta; if(!ta) return;
  const v=ta.value; let s=v.lastIndexOf("\n",ta.selectionStart-1)+1;
  let en=v.indexOf("\n",Math.max(ta.selectionEnd,ta.selectionStart)); en=en<0?v.length:en+1;
  if(en===v.length && s>0) s--;
  ta.setRangeText("",s,en,"end"); ta.dispatchEvent(new Event("input")); ta.focus();
}
function edBackspace(){
  const e=ed; if(!e||!e.loaded) return;
  if(e.cm){ const cm=e.cm; if(cm.somethingSelected()) cm.replaceSelection("","start"); else cm.execCommand("delCharBefore"); cm.focus(); return; }
  const ta=e.ta; if(!ta) return;
  if(ta.selectionStart!==ta.selectionEnd) ta.setRangeText("",ta.selectionStart,ta.selectionEnd,"end");
  else if(ta.selectionStart>0) ta.setRangeText("",ta.selectionStart-1,ta.selectionStart,"end");
  ta.dispatchEvent(new Event("input")); ta.focus();
}

/* ---- editor view ---- */
const ED_KEYS=["Tab","←","→","⌫","{","}","(",")","[","]","<",">","/","\\","\"","'",";",":","=","_","-","+","*","&","|","!","#","$","%","?",".","إكمال"];
const ED_TOOLS=[["undo","undo","","تراجع"],["redo","redo","","إعادة"],"|",["paste","paste","","لصق من الحافظة"],["delLine","delline","","حذف السطر"],["delAll","trash","","حذف كل المحتوى"],"|",["find","search","","بحث واستبدال"],["goto","","Ln","الانتقال إلى سطر"],"|",["comment","","//","تعليق/إلغاء تعليق"],["indentMore","indent","","زيادة المسافة البادئة"],["indentLess","outdent","","تقليل المسافة البادئة"],"|",["foldAll","fold","","طيّ الكل"],["unfoldAll","unfold","","فتح الكل"],["wrap","wrap","","التفاف الأسطر"],"|",["fsDown","","A−","تصغير الخط"],["fsUp","","A+","تكبير الخط"]];

function renderEditor(){
  const e=ed;

  if(e.loaded) setTimeout(()=>mountEditor(wrap,null),0);

function edTool(id,btn){
  const e=ed; if(!e||!e.loaded) return;
  if(id==="find") return openFind(false);
  if(id==="paste") return edPaste();
  if(id==="delAll") return edDeleteAll();
  if(id==="delLine") return edDeleteLine();
  const cm=e.cm;
  if(!cm) return toast("هذه الأداة تحتاج المحرر المتقدّم (يتطلب اتصالاً بالإنترنت).","info");
  switch(id){
    case "undo": cm.undo(); cm.focus(); break;
    case "redo": cm.redo(); cm.focus(); break;
    case "goto": showGoto(); break;
    case "comment": if(cm.toggleComment) cm.toggleComment({indent:true}); cm.focus(); break;
    case "indentMore": cm.execCommand("indentMore"); cm.focus(); break;
    case "indentLess": cm.execCommand("indentLess"); cm.focus(); break;
    case "foldAll": cm.execCommand("foldAll"); break;
    case "unfoldAll": cm.execCommand("unfoldAll"); break;
    case "wrap": e.prefs.wrap=!e.prefs.wrap; cm.setOption("lineWrapping",e.prefs.wrap); btn.classList.toggle("on",e.prefs.wrap); saveEdPrefs(e.prefs); break;
    case "fsDown": case "fsUp":
      e.prefs.fs=Math.min(22,Math.max(10,e.prefs.fs+(id==="fsUp"?1:-1)));
      cm.getWrapperElement().style.fontSize=e.prefs.fs+"px"; cm.refresh(); saveEdPrefs(e.prefs); break;
  }
}
function edKey(k){
  const e=ed; if(!e||!e.loaded) return;
  const cm=e.cm;
  if(!cm){
    const ta=e.ta; if(!ta) return;
    if(k==="⌫") return edBackspace();
    const ins=k==="Tab"?"  ":((k.length===1&&k!=="←"&&k!=="→")?k:"");
    if(ins){ const s=ta.selectionStart; ta.setRangeText(ins,s,ta.selectionEnd,"end"); ta.dispatchEvent(new Event("input")); }
    return;
  }
  if(k==="Tab") edTab(cm);
  else if(k==="⌫"){ edBackspace(); return; }
  else if(k==="←") cm.execCommand("goCharLeft");
  else if(k==="→") cm.execCommand("goCharRight");
  else if(k==="إكمال") cm.showHint({hint:CodeMirror.hint.anyword,completeSingle:false});
  else cm.replaceSelection(k,"end");
  cm.focus();
}
function edTab(cm){
  if(cm.somethingSelected()) cm.indentSelection("add");
  else if(cm.getOption("indentWithTabs")) cm.replaceSelection("\t","end");
  else { const n=cm.getOption("indentUnit"), col=cm.getCursor().ch; cm.replaceSelection(" ".repeat(n-(col%n)),"end"); }
}
function edStatus(){
  const e=ed, box=document.getElementById("edStatus"); if(!e||!box) return;
  const kind=kindOf(e.path.split("/").pop());
  let pos="";
  if(e.cm){ const c=e.cm.getCursor(), sel=e.cm.somethingSelected()?e.cm.getSelection().length:0; pos=`<span>Ln ${c.line+1}, Col ${c.ch+1}</span>${sel?`<span>${sel} sel</span>`:""}<span>${e.cm.lineCount()} lines</span>`; }
  box.innerHTML=`${pos}<span>${esc(kind.label)}</span><span>UTF-8${e.bom?" BOM":""}</span><span>${e.crlf?"CRLF":"LF"}</span><span>${e.indent.tabs?"Tabs":"Spaces: "+e.indent.size}</span>`;
}
function mountEditor(wrap,text){
  const e=ed; if(!e) return;
  const host=wrap.querySelector("#edHost"); if(!host) return;
  host.innerHTML="";
  if(e.cmOk && window.CodeMirror){
    if(!e.cm){
      const ind=e.indent;
      const cm=CodeMirror(host,{
        value:text!==null?text:e.text0, mode:cmModeFor(e.path), theme:"gitora",
        lineNumbers:true, lineWrapping:!!e.prefs.wrap, indentUnit:ind.size, tabSize:ind.size, indentWithTabs:ind.tabs,
        smartIndent:true, electricChars:true, autoCloseBrackets:true, matchBrackets:true, autoCloseTags:true, matchTags:{bothTags:true},
        styleActiveLine:true, foldGutter:true, gutters:["CodeMirror-linenumbers","CodeMirror-foldgutter"],
        highlightSelectionMatches:{minChars:2,showToken:/\w/,annotateScrollbar:false},
        viewportMargin:30, spellcheck:false, autocorrect:false, autocapitalize:false,
        extraKeys:{
          "Ctrl-S":()=>showSave(), "Cmd-S":()=>showSave(),
          "Ctrl-F":()=>openFind(false), "Cmd-F":()=>openFind(false),
          "Ctrl-H":()=>openFind(true), "Cmd-Alt-F":()=>openFind(true),
          "Ctrl-G":()=>showGoto(), "Cmd-G":()=>showGoto(),
          "Ctrl-/":cm=>{ if(cm.toggleComment) cm.toggleComment({indent:true}); }, "Cmd-/":cm=>{ if(cm.toggleComment) cm.toggleComment({indent:true}); },
          "Ctrl-Space":cm=>cm.showHint({hint:CodeMirror.hint.anyword,completeSingle:false}),
          "Tab":cm=>edTab(cm), "Shift-Tab":"indentLess",
          "Esc":cm=>{ if(e.find.open) closeFind(); else return CodeMirror.Pass; },
        },
      });
      cm.getWrapperElement().style.fontSize=e.prefs.fs+"px";
      e.cm=cm; e.gen=cm.changeGeneration(true);
      cm.on("cursorActivity",edStatus);
      /* إصلاح الحذف على كيبورد الجوال: نتولى حذف التحديد ودمج الأسطر بأنفسنا */
      const inp=cm.getInputField();
      inp.addEventListener("beforeinput",ev=>{
        const t=ev.inputType||"";
        if(!/^delete(ContentBackward|ContentForward|WordBackward|WordForward)$/.test(t)) return;
        if(ev.isComposing || ev.cancelable===false) return;
        if(cm.somethingSelected()){ ev.preventDefault(); cm.replaceSelection("","start"); return; }
        const c=cm.getCursor();
        if(t==="deleteContentBackward" && c.ch===0 && c.line>0){ ev.preventDefault(); cm.execCommand("delCharBefore"); }
        else if(t==="deleteContentForward" && c.ch===cm.getLine(c.line).length && c.line<cm.lastLine()){ ev.preventDefault(); cm.execCommand("delCharAfter"); }
      });
      cm.on("change",()=>{ syncDirty(); if(e.find.open && e.find.q){ clearTimeout(e.find.t); e.find.t=setTimeout(fRun,250); } });
    } else host.appendChild(e.cm.getWrapperElement());
    setTimeout(()=>{ if(e.cm) e.cm.refresh(); },30);
  } else {
    if(!e.ta){
      const ta=document.createElement("textarea"); ta.className="edfallback"; ta.spellcheck=false; ta.value=e.text0;
      ta.addEventListener("input",syncDirty);
      ta.addEventListener("keydown",ev=>{
        if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==="s"){ ev.preventDefault(); showSave(); }
        else if(ev.key==="Tab"){ ev.preventDefault(); ta.setRangeText("  ",ta.selectionStart,ta.selectionEnd,"end"); ta.dispatchEvent(new Event("input")); }
      });
      e.ta=ta;
      toast("تعذّر تحميل المحرر المتقدّم (تحقق من الاتصال). فُتح محرر نصي بسيط.","error");
    }
    host.appendChild(e.ta);
  }
  edStatus(); syncDirty(); edFit();
}
